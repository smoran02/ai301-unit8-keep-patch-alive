/* Keep Patch Alive. The AI301 brand, applied the way the course decks
   apply it:
   - White ground with the gallery splotches: title-splotch as a full-bleed
     masthead on the start screen, section-glow on each week's opener,
     closing-teal on the finish, a content-light teal corner at the foot.
   - Fills carry meaning, never white cards on white: Sky = something you
     pick or assemble, grey #F5F5F5 = documents (the PR thread), Medium Navy
     = Monty (a tool, the dark content field), mint / peach / buttermilk =
     right / wrong / new.
   - Small corner radius (8px), no bare outlines, no heavy shadows.
   - Space Mono display, Poppins body (bold lead word, regular rest), Roboto
     Mono code; green only for eyebrows, markers, and step numbers;
     Periwinkle only for the next-step button.
   Big type: the captain shares this screen in a Zoom breakout room. */
:root {
  --ink: #062F54;
  --muted: #5A6472;
  --indigo: #1B1C57;
  --green: #00C385;
  --peri: #4F5DFF;
  --peri-dark: #3B47D9;
  --capri: #02BCFF;
  --sky: #E9F6FF;
  --sky-hover: #D5ECFC;
  --doc: #F5F5F5;
  --mint: #D7FFEE;
  --peach: #FFEDF0;
  --butter: #FFF6BF;
  --rose: #C36E91;
  --hair: #E3EAF1;
  --on-navy: #B9C9DB;
  --navy-hair: rgba(255, 255, 255, 0.14);
  --r: 8px;
  --r-sm: 6px;
  --display: 'Space Mono', ui-monospace, monospace;
  --body: 'Poppins', system-ui, sans-serif;
  --code: 'Roboto Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; overflow-x: clip; }
body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; position: relative; min-height: 100vh; overflow-x: clip; }
/* content-light: the teal splotch fading in at the foot of the page, never behind the work */
body::after { content: ''; position: absolute; right: 0; bottom: 0; width: 720px; height: 380px; z-index: -1; pointer-events: none; background: var(--bg-content) no-repeat right bottom / 1440px 810px; opacity: 0.75; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--peri); outline-offset: 2px; }
code { font-family: var(--code); font-size: 0.88em; background: rgba(6, 47, 84, 0.07); padding: 1px 5px; border-radius: 4px; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ------------------------------------------------------------ top bar */
.bar { display: flex; align-items: center; gap: 18px; padding: 12px 28px; border-bottom: 1px solid var(--hair); background: #FFFFFF; position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.bar .logo { height: 20px; }
.bar .gname { font-family: var(--display); font-size: 17px; font-weight: 400; white-space: nowrap; padding-left: 18px; border-left: 1px solid var(--hair); }
.cal { flex: 1; display: flex; gap: 6px; min-width: 420px; }
.cal[hidden] { display: none; }
.cal-wk { flex: 1; min-width: 0; }
.cal-wk .cal-l { font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-wk.cur .cal-l { color: var(--ink); font-weight: 600; }
.cal-days { display: flex; gap: 2px; margin-top: 3px; }
.cal-d { flex: 1; height: 8px; border-radius: 2px; background: var(--sky); position: relative; }
.cal-d.past { background: #9DB3C9; }
.cal-d.now { background: var(--ink); height: 12px; margin-top: -2px; }
.cal-day { font-family: var(--display); font-size: 15px; white-space: nowrap; }

/* ------------------------------------------------------------ layout */
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 28px 72px; }
.game { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 32px; align-items: start; }
.side { display: flex; flex-direction: column; gap: 16px; }
@media (min-height: 940px) and (min-width: 981px) { .side { position: sticky; top: 86px; } }
.main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.narrow { max-width: 840px; margin: 0 auto; }
.wide { max-width: 1180px; margin: 0 auto; }

h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
h1 { font-size: 40px; }
h2 { font-size: 28px; }
h3 { font-size: 20px; }
.eyebrow { font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); font-size: 13px; margin: 0 0 6px; }
.lead { font-size: 19px; max-width: 68ch; }
.soft { color: var(--muted); }
p { margin: 0 0 10px; }
b, strong { font-weight: 600; }

/* ------------------------------------------------------------ buttons */
.cta { background: var(--peri); color: #FFFFFF; font-weight: 600; padding: 12px 24px; border-radius: var(--r); font-size: 17px; }
.cta:hover:not(:disabled) { background: var(--peri-dark); }
.cta:disabled { background: #DDE1E6; color: #4A5A6A; }
.ghost { background: var(--doc); color: var(--ink); font-weight: 500; padding: 11px 20px; border-radius: var(--r); }
.ghost:hover { background: #EAEDF1; }
.linkish { color: var(--peri-dark); text-decoration: underline; font-weight: 600; padding: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ------------------------------------------------------------ the chart (rule 1's evidence) */
.chart-fig { margin: 0 0 20px; }
.chart { display: flex; gap: 14px; align-items: stretch; height: 104px; padding: 0 2px; border-bottom: 2px solid var(--ink); }
.chart .bar-c { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.chart .bar-f { width: 100%; background: var(--ink); border-radius: 4px 4px 0 0; }
.chart .bar-c i { font-style: normal; font-family: var(--display); font-size: 13px; margin-bottom: 2px; }
.chart .bar-c span { position: absolute; bottom: -24px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.chart-fig figcaption { margin-top: 32px; font-size: 13px; color: var(--muted); }

/* ------------------------------------------------------------ Monty: the navy field */
.monty { background: var(--ink); color: #FFFFFF; border-radius: var(--r); padding: 18px 20px 20px; }
.monty-head { display: flex; gap: 14px; align-items: center; }
.mbadge { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--sky); display: flex; align-items: center; justify-content: center; }
.mbadge canvas { width: 44px; height: 44px; }
.monty-head b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.25; }
.monty-head > div > span { display: block; font-size: 14px; line-height: 1.4; color: var(--on-navy); margin-top: 2px; }
.pb-list { list-style: none; padding: 0; margin: 16px 0 0; }
.pb-list li { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--navy-hair); }
.pb-list .n { flex: none; font-family: var(--display); font-size: 14px; color: var(--green); width: 22px; padding-top: 1px; }
.pb-list b { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-navy); }
.pb-list span:not(.n) { display: block; font-size: 15px; line-height: 1.4; }
.pb-list .unset { color: #8A97A6; }
.pb-list li.now { background: rgba(255, 255, 255, 0.08); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
/* beside the turns, the playbook is a reference document: grey, compact, no sprite.
   The row being written turns Sky; the row just written turns mint. */
.side .monty { background: var(--doc); color: var(--ink); padding: 16px 18px 18px; }
.side .monty .mbadge { display: none; }
.side .monty-head b { font-size: 17px; }
.side .monty-head > div > span { color: var(--muted); font-size: 13px; }
.side .pb-list { margin-top: 10px; }
.side .pb-list li { border-top-color: #E4E7EB; padding: 9px 0; }
.side .pb-list b { color: var(--muted); }
.side .pb-list .n { color: var(--ink); }
.side .monty .pb-list span:not(.n) { font-size: 14px; }
.side .pb-list li.now, .side .pb-list li.fresh { margin: 0 -18px; padding-left: 18px; padding-right: 18px; border-radius: 0; }
.side .pb-list li.now { background: var(--sky); }
.side .pb-list li.fresh { background: var(--mint); }
.side .pb-list li.now + li, .side .pb-list li.fresh + li { border-top-color: transparent; }

/* rule turns */
.rulehead h3 { font-size: 26px; margin: 2px 0 6px; }
.rule-why { color: var(--muted); max-width: 62ch; margin-bottom: 14px; }
.evidence { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
.ev-q { background: var(--doc); border-radius: var(--r-sm); padding: 10px 14px; font-size: 16px; }
.ev-from { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.written { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(6, 47, 84, 0.12); font-size: 15px; }
.written span { color: var(--ink); margin-right: 8px; }
.newrule { font-size: 17px; margin: 14px 0 6px; }
.card.section .newrule b { color: #FFFFFF; }
.pb-final { list-style: none; padding: 0; margin: 10px 0 8px; }
.pb-final li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(6, 47, 84, 0.12); font-size: 16px; }
.pb-final .n { font-family: var(--display); color: var(--ink); width: 24px; flex: none; }
.pb-final b { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ------------------------------------------------------------ pet panel */
.pet { background: var(--mint); border-radius: var(--r); padding: 16px 16px 16px; position: relative; text-align: center; }
/* Sky behind Patch, grass from Patch's feet down, so the seam never crosses the text. */
.pet .home { position: relative; box-sizing: content-box; height: 240px; margin: -16px -16px 0; padding: 16px 16px 0; background: var(--sky); border-radius: var(--r) var(--r) 0 0; display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
/* Never squeeze Patch when the second pet shows; the canvases' empty bottom rows sit below the seam so the feet meet it. */
.pet canvas.main { width: 240px; height: 240px; flex-shrink: 0; margin-bottom: -18px; }
.pet canvas.sib { width: 120px; height: 120px; margin-left: -40px; flex-shrink: 0; margin-bottom: -9px; }
.pet .bubble { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); background: #FFFFFF; border-radius: var(--r); padding: 4px 14px; font-family: var(--display); font-size: 18px; box-shadow: 0 3px 10px rgba(6, 47, 84, 0.15); white-space: nowrap; }
.pet .pname { font-family: var(--display); font-size: 24px; margin-top: 10px; }
.pet .pstage { font-size: 13px; color: var(--muted); }
.hearts { display: flex; justify-content: center; gap: 8px; margin: 10px 0 4px; min-height: 28px; }
.hearts canvas { width: 28px; height: 28px; }
.hearts canvas.pop { animation: pop 0.5s ease; }
@keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
.mood { font-size: 15px; min-height: 22px; }
.wardrobe { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
.chip { background: #FFFFFF; color: var(--ink); padding: 4px 12px; font-size: 13px; font-weight: 500; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
.chip.grey { background: var(--sky); }
.chip.grey:hover { background: var(--sky-hover); }
.chip.grey[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; }
details.repo { background: var(--doc); border-radius: var(--r); padding: 12px 16px; font-size: 14px; }
details.repo summary { cursor: pointer; font-weight: 600; }
details.repo ol { padding-left: 20px; margin: 8px 0 4px; }
details.repo li { margin-bottom: 6px; }

/* ------------------------------------------------------------ week header */
.weekhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.pace { font-size: 14px; font-weight: 500; background: var(--sky); border-radius: 999px; padding: 5px 14px; white-space: nowrap; }
.pace.over { background: var(--butter); }
.banner { background: var(--butter); border-radius: var(--r); padding: 10px 14px; font-weight: 600; }
/* The TF demo's banner: on every demo screen, above everything else. */
.demo-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; background: var(--butter); border-radius: var(--r); padding: 10px 14px; margin: 0 0 20px; }
.demo-bar .demo-t { font-weight: 700; }
.demo-bar .ghost { background: #FFFFFF; padding: 7px 14px; font-size: 15px; }
.demo-bar .ghost:hover { background: var(--sky); }

/* ------------------------------------------------------------ the thread (a document: grey) */
.thread { background: var(--doc); border-radius: var(--r); padding: 18px 20px; }
.pr-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.pr-head .repo-n { font-size: 14px; color: var(--muted); }
.pr-head .pr-t { font-family: var(--display); font-size: 19px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.pill.open { background: var(--green); color: var(--ink); }
.pill.merged { background: #B243FF; color: #FFFFFF; }
.pill.closed { background: #D3DAE2; color: var(--ink); }
.pr-sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.pr-sub b { color: var(--ink); }
.events { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.earlier { font-size: 14px; color: var(--muted); }
.ev { display: flex; gap: 10px; align-items: flex-start; }
.ev .av { width: 34px; height: 34px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
.ev .body { background: #FFFFFF; border-radius: var(--r); padding: 9px 14px; flex: 1; min-width: 0; }
.ev.new .body { background: var(--butter); }
.ev .who { font-weight: 600; font-size: 14px; }
.ev .who .tag { font-size: 11px; font-weight: 700; background: var(--doc); color: var(--muted); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
.ev .who .newtag { background: #FFFFFF; color: var(--ink); }
.ev .who .day { font-weight: 400; color: var(--muted); margin-left: 6px; }
.ev.mine .body { background: var(--mint); }
.ev .rv { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 7px; margin-left: 6px; }
.rv.changes { background: var(--peach); color: var(--ink); }
.rv.approved { background: var(--mint); color: var(--ink); }
.rv.reviewed { background: var(--sky); color: var(--ink); }
.rc { background: var(--doc); border-radius: var(--r-sm); padding: 8px 10px; margin-top: 8px; font-size: 15px; display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 8px; align-items: start; }
.rc > * { grid-column: 2; }
.rc > .n { grid-column: 1; grid-row: 1 / span 3; }
.rc .where { font-family: var(--code); font-size: 12.5px; color: var(--muted); }
.rc .n { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--ink); color: var(--green); font-family: var(--display); font-size: 12px; margin-right: 0; }
.sugg { margin-top: 6px; font-family: var(--code); font-size: 13px; border-radius: var(--r-sm); overflow: hidden; }
.sugg div { padding: 2px 8px; white-space: pre-wrap; }
.sugg .minus { background: var(--peach); }
.sugg .plus { background: var(--mint); }
.sys { font-size: 14px; color: var(--muted); padding-left: 44px; position: relative; }
.sys::before { content: ''; position: absolute; left: 13px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: #B8C4D2; }
.sys.new { color: var(--ink); font-weight: 600; }
.sys.new::before { background: var(--green); }
.sys.status { background: var(--peach); color: var(--ink); border-radius: var(--r-sm); padding: 8px 12px 8px 44px; font-weight: 600; }
.sys.status::before { background: var(--rose); top: 15px; }
.checks { list-style: none; padding: 0; margin: 0 0 0 44px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.checks li { display: flex; gap: 8px; align-items: center; }
.ck { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; min-width: 56px; text-align: center; color: var(--ink); }
.ck.pass { background: var(--mint); }
.ck.fail { background: var(--peach); }
.ck.pending { background: var(--butter); }

/* ------------------------------------------------------------ decision area (on the white ground) */
.decide { padding: 4px 0 0; }
.ask { font-family: var(--display); font-size: 22px; line-height: 1.35; margin-bottom: 16px; }
.ref { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.callhead { margin: 22px 0 10px; }

/* Monty's read, inside the navy field */
.mfield { background: var(--ink); color: #FFFFFF; border-radius: var(--r); padding: 18px 20px 20px; }
.read { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 16px 0 6px; border-top: 1px solid var(--navy-hair); border-bottom: 1px solid var(--navy-hair); }
.read div { padding: 8px 12px; border-left: 1px solid var(--navy-hair); }
.read div:first-child { border-left: 0; padding-left: 0; }
.read b { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
.read span { font-size: 15px; }
.read .state span { font-weight: 600; }
.mwhy { font-size: 15px; color: var(--on-navy); margin-top: 8px; }
.mwhy .found { display: block; font-family: var(--code); font-size: 13px; }
.mwhy code, .read code { background: rgba(255, 255, 255, 0.14); color: inherit; }
.draft { background: #FFFFFF; color: var(--ink); border-radius: var(--r-sm); padding: 12px 16px; margin-top: 14px; }
.draft .dk { display: flex; flex-wrap: wrap; row-gap: 2px; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; gap: 10px; }
.draft p { margin: 0 0 6px; font-size: 17px; }
.draft p:last-child { margin-bottom: 0; }
.decide > .draft { background: var(--sky); }

/* choice tiles: Sky fill, navy text, a letter key. Right = mint, crossed out = peach. */
.act, .opt { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: var(--sky); color: var(--ink); border-radius: var(--r); padding: 14px 18px; font-size: 17px; line-height: 1.45; transition: background 0.12s; position: relative; }
.act:hover:not(:disabled), .opt:hover:not(:disabled) { background: var(--sky-hover); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; color: var(--ink); font-family: var(--display); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; margin-top: -1px; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.acts .opt { align-items: center; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.act { justify-content: center; text-align: center; font-size: 18px; font-weight: 600; padding: 18px 12px; }
.opt.mono { font-family: var(--code); font-size: 16px; }
.opt .tx { flex: 1; min-width: 0; padding-top: 1px; }
.opt pre, .opts pre { margin: 6px 0 0; }
.act.x, .opt.x { background: var(--peach); color: #8E6878; text-decoration: line-through; }
.act.ok, .opt.ok { background: var(--mint); }
.act.dim, .opt.dim { opacity: 0.4; }
.act.hinted::after, .opt.hinted::after { content: 'Ren: not this one'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; text-decoration: none; background: #FFFFFF; color: var(--ink); border-radius: 4px; padding: 1px 6px; }
pre.code { font-family: var(--code); font-size: 14px; background: var(--indigo); color: #FFFFFF; border-radius: var(--r); padding: 10px 12px; overflow-x: auto; margin: 0 0 12px; line-height: 1.45; }
.opt pre.code { font-size: 13px; margin: 8px 0 0; text-decoration: none; }
pre.code .cm { color: #FEA08D; }
pre.code .ok { color: #93FCAC; }

.tplan { background: var(--sky); margin: 0 0 10px; padding: 10px 14px; }
.tplan p { font-size: 15px; margin: 0 0 4px; }
.tplan code { white-space: nowrap; }
.nw { white-space: nowrap; }
.term { background: var(--ink); color: #FFFFFF; border-radius: var(--r); padding: 12px 16px; font-family: var(--code); font-size: 14px; line-height: 1.5; margin-bottom: 14px; }
.term .th { font-size: 12px; color: var(--on-navy); margin-bottom: 6px; }
.term div { white-space: pre-wrap; word-break: break-word; }
.term .cmd { color: #93FCAC; }
.term .err { color: #FEA08D; }

.say { border-radius: var(--r); padding: 14px 18px; margin-top: 14px; font-size: 17px; }
.say.right { background: var(--mint); }
.say.wrong { background: var(--peach); }
.say .h { font-family: var(--display); font-size: 18px; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.say .h canvas { width: 22px; height: 22px; }
.say ul { margin: 6px 0 0; padding-left: 20px; }
.say li { margin-bottom: 6px; }
.say li q { font-style: italic; }
.after { display: flex; justify-content: flex-end; margin-top: 14px; gap: 10px; }

/* editor: lines in the post are Sky, lines out of it fade back */
.ed-h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; }
.ed-lines { display: flex; flex-direction: column; gap: 6px; }
.ln { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--sky); border-radius: var(--r-sm); padding: 10px 14px; font-size: 16px; width: 100%; }
.ln:hover:not(:disabled) { background: var(--sky-hover); }
.ln .tg { flex: none; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 7px; margin-top: 3px; background: #FFFFFF; min-width: 54px; text-align: center; }
.ln.cut { background: var(--doc); color: #8A97A6; }
.ln.cut:hover:not(:disabled) { background: #ECEEF1; }
.ln.cut .tx { text-decoration: line-through; }
.ln.tray { background: var(--doc); }
.ln.tray:hover:not(:disabled) { background: #ECEEF1; }
.ln.tray.on { background: var(--mint); }
.ln.prob { background: var(--peach); color: var(--ink); }
.ln.prob .tx { text-decoration: none; }
.ln.hint { background: var(--butter); }
.preview { background: #FFFFFF; border-top: 2px solid var(--ink); padding: 12px 2px 0; margin-top: 18px; }
.preview .pv-h { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
.preview p { margin: 4px 0; }
.ed-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

/* ------------------------------------------------------------ scenes, intro, done */
.card { background: var(--sky); border-radius: var(--r); padding: 24px 26px; }
.card.mint { background: var(--mint); }
.card.butter { background: var(--butter); }
.card.peach { background: var(--peach); }
.center { text-align: center; }
.big-art { display: flex; justify-content: center; margin: 8px 0; }
.big-art canvas { width: 240px; height: 240px; }
.scene-cv { width: 100%; max-width: 576px; aspect-ratio: 96 / 56; height: auto; background: #FFFFFF; border-radius: var(--r); margin: 10px auto; }
.mistakes { list-style: none; padding: 0; margin: 10px 0; text-align: left; }
.mistakes li { background: #FFFFFF; border-radius: var(--r-sm); padding: 9px 14px; margin-bottom: 8px; font-size: 15px; }
.mistakes li b { display: block; }
.snacks { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
.item { background: #FFFFFF; border-radius: var(--r); padding: 10px; text-align: center; font-weight: 500; }
.item:hover { background: var(--sky); }
.item canvas { width: 144px; height: 144px; margin: 0 auto 4px; }
.item.rare { background: var(--butter); }
.item .r { display: block; font-size: 12px; color: var(--ink); font-weight: 700; }

.cards4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.badge { display: inline-flex; gap: 6px; align-items: center; background: var(--butter); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px; margin: 0 6px 6px 0; }
.badge::before { content: '\2731'; color: var(--green); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; margin: 4px 0 18px; }
.stats div { padding: 6px 14px; border-left: 1px solid var(--hair); font-size: 14px; color: var(--muted); }
.stats div:first-child { border-left: 0; padding-left: 0; }
.stats b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; color: var(--ink); }
.next3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.next3 button { background: #FFFFFF; border-radius: var(--r); padding: 16px 18px; text-align: left; }
.next3 button:hover { background: var(--sky-hover); }
.next3 button b { display: block; font-family: var(--display); font-weight: 400; font-size: 19px; margin-bottom: 4px; }
.next3 button span { font-size: 14px; color: var(--muted); }
.next3 button.done { background: var(--mint); }

/* pets (overtime) */
.petcard { background: var(--sky); border-radius: var(--r); padding: 14px; text-align: center; }
.petcard:hover { background: var(--sky-hover); }
.petcard canvas { width: 120px; height: 120px; margin: 0 auto; }
.petcard.happy { background: var(--mint); }
.petcard.grumpy { background: var(--peach); }
.petcard b { font-family: var(--display); font-weight: 400; font-size: 19px; display: block; }
.petcard .soft { font-size: 13px; }

/* boss */
.storm { display: flex; flex-direction: column; gap: 6px; }
.sc { background: var(--doc); border-radius: var(--r-sm); padding: 9px 12px; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.sc.done { background: var(--mint); }
.sc .n { font-family: var(--display); color: var(--muted); }
.sc .who { font-weight: 600; font-size: 13px; }
.sc .t { font-size: 15px; }
.sc .sorts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.sc .sorts button { background: var(--sky); border-radius: var(--r-sm); padding: 4px 10px; font-size: 13px; font-weight: 500; }
.sc .sorts button:hover { background: var(--peri); color: #FFFFFF; }
.sc .got { font-size: 13px; font-weight: 700; }
.sc .quip { grid-column: 2 / 4; font-size: 14px; background: var(--peach); border-radius: var(--r-sm); padding: 4px 10px; }
.storm-left { position: sticky; top: 92px; z-index: 5; background: var(--ink); color: #FFFFFF; font-family: var(--display); border-radius: var(--r); padding: 9px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 14px 0 10px; }

/* booth */
.booth { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 28px; align-items: start; }
.booth canvas { width: 100%; max-width: 480px; height: auto; aspect-ratio: 1; border-radius: var(--r); }

/* ------------------------------------------------------------ start: title-splotch masthead */
.hero { background: #3E4C82 var(--bg-title) center / cover no-repeat; color: #FFFFFF; margin: -28px calc(50% - 50vw) 40px; padding: 56px 28px 52px; }
.hero-in { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 32px; align-items: center; }
.hero-eb { font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 10px; }
.hero h1 { font-weight: 700; font-size: 54px; line-height: 1.1; }
.hero-rule { width: 240px; height: 2px; background: #FFFFFF; margin: 20px 0 18px; }
.hero-sub { font-size: 18px; font-weight: 300; max-width: 58ch; margin: 0; }
.hero canvas { width: 220px; height: 220px; }
.steps { list-style: none; padding: 0; margin: 6px 0 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; counter-reset: st; }
.steps li { padding: 14px 0 14px 50px; font-size: 16px; border-top: 1px solid var(--hair); position: relative; counter-increment: st; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 14px; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--green); font-family: var(--display); font-size: 15px; display: flex; align-items: center; justify-content: center; }
.field { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field input { font: inherit; font-size: 18px; padding: 11px 14px; border-radius: var(--r); border: 0; background: #FFFFFF; color: var(--ink); width: 140px; }
.field input:focus { outline: 3px solid var(--peri); outline-offset: 0; }
.eggs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0; }
.eggs button { background: var(--sky); border-radius: var(--r); padding: 12px; font-weight: 500; }
.eggs button:hover { background: var(--sky-hover); }
.eggs canvas { width: 144px; height: 144px; margin: 0 auto; }
.namebox { font-family: var(--display); font-size: 36px; background: var(--sky); border-radius: var(--r); padding: 10px 24px; display: inline-block; min-width: 280px; text-align: center; }

/* confetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; animation: fall 2.6s linear forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); } }

footer { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 0 30px; }

details.earlier { margin-top: 10px; }
details.earlier summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); }
details.earlier .events { margin-top: 8px; opacity: 0.85; }

/* section-glow: each week's opener is a section divider (white text, left text-safe zone) */
.card.section { background: #1B1C57 var(--bg-section) right center / cover no-repeat; color: #FFFFFF; padding: 40px 40px 36px; }
.card.section .inner { max-width: 62%; }
.card.section .eyebrow { color: var(--green); }
.card.section .soft { color: #C8D3E8; }
/* closing-teal: the finish (white text on the left half) */
.card.closing { background: #0B6F8A var(--bg-closing) left center / cover no-repeat; color: #FFFFFF; text-align: left; padding: 34px 36px; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 20px; align-items: center; }
.card.closing .eyebrow { color: #FFFFFF; opacity: 0.9; }
.card.closing .lead { color: #FFFFFF; }

/* ------------------------------------------------------------ small screens */
@media (max-width: 980px) {
  .game { grid-template-columns: minmax(0, 1fr); }
  /* One column: Patch, then the turn, then Monty's playbook and CONTRIBUTING.md. */
  .side { display: contents; }
  .side > .pet { order: 1; }
  .game > .main { order: 2; }
  .side > .monty { order: 3; }

<script>window.KPA_CONFIG = {"reportUrl":"https://keep-patch-alive-board.merge-or-close-board.workers.dev/report","storeKey":"keep-patch-alive-v2"};</script>
<script>
/* Patch: the unit 8 PR pet. A tiny pixel sprite engine.

   Patch is drawn on a 48 x 48 logical grid and scaled up crisp. The body
   is a soft mochi blob; the signature feature is the sprout on its head,
   which is a little git graph: one line and a node while the PR waits, a
   fork with a second node after the review, and a merged loop once the PR
   lands. The sprout also carries mood: it droops, ties itself in a knot,
   and turns into a bindle stick when Patch is about to walk out.

   Patch.draw(canvas, opts, t) draws one frame. opts:
     color  lime | capri | violet | lemon
     stage  egg | sprout | branch | merged
     mood   content | happy | side | packing | sleepy | sick | knotted |
            nervous | proud | ghost
     items  array of item ids (see ITEMS)
     dx, dy pixel offset (used for walking and hopping)
   t is a frame counter (the page ticks it 6 times a second).
*/
(function (global) {
  'use strict';

  var W = 48, H = 48, GROUND = 44, CX = 24;
  var NAVY = '#062F54';

  var COLORS = {
    lime:   { name: 'Lime',   base: '#93FCAC', shade: '#4CDA8E', light: '#E3FFEA', shell: '#E6FFF1', spot: '#93FCAC' },
    capri:  { name: 'Capri',  base: '#93DDFF', shade: '#45B6EA', light: '#EAF7FF', shell: '#EAF7FF', spot: '#93DDFF' },
    violet: { name: 'Violet', base: '#FDB5FF', shade: '#DE80E4', light: '#FFF0FF', shell: '#FFF0FF', spot: '#FDB5FF' },
    lemon:  { name: 'Lemon',  base: '#FFE37A', shade: '#EFBA2C', light: '#FFF8CF', shell: '#FFF8D6', spot: '#FFE37A' }
  };

  // Shared ink. One letter per color so sprites can be written as text.
  var INK = {
    N: NAVY, W: '#FFFFFF', K: '#1B1C57', k: '#3B3D8F',
    G: '#00C385', g: '#8CF0C8',
    B: '#4F5DFF', b: '#A3AAFF',
    Y: '#FFCB03', y: '#C99600', u: '#FFE680',
    O: '#FE6901', o: '#FFAA6B',
    R: '#FE3C84', r: '#FFA8C8', d: '#C92A66',
    C: '#02BCFF', c: '#C4EEFF',
    S: '#D3DAE2', s: '#8D99A6',
    P: '#FF8FB4', p: '#FF5C93',
    M: '#D7FFEE', T: '#FFF6BF'
  };

  // ---- grid ---------------------------------------------------------
  function Grid() { this.px = new Array(W * H); this.ox = 0; this.oy = 0; }
  Grid.prototype.put = function (x, y, c) {
    if (!c) return;
    x = Math.round(x + this.ox); y = Math.round(y + this.oy);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    this.px[y * W + x] = c;
  };
  Grid.prototype.sprite = function (rows, x0, y0, flip, map) {
    for (var j = 0; j < rows.length; j++) {
      var row = rows[j], w = row.length;
      for (var i = 0; i < w; i++) {
        var ch = row.charAt(flip ? w - 1 - i : i);
        if (ch === '.' || ch === ' ') continue;
        this.put(x0 + i, y0 + j, (map && map[ch]) || INK[ch]);
      }
    }
  };
  // Draw a left-side sprite and its mirror on the right (mirror about the
  // body's center line). flip=false keeps the right copy facing the same
  // way, for things like highlights and side-eye pupils.
  Grid.prototype.pair = function (rows, x0, y0, flip, map) {
    var w = rows[0].length;
    this.sprite(rows, x0, y0, false, map);
    this.sprite(rows, 2 * CX - x0 - w, y0, flip !== false, map);
  };

  // ---- shapes -------------------------------------------------------
  function blob(cx, cy, rx, ry) {
    return function (x, y) {
      var dy = (y + 0.5 - cy) / ry;
      var dx = (x + 0.5 - cx) / (rx * (1 + 0.07 * dy));
      var n = dy < 0 ? 2.0 : 2.7;
      return Math.pow(Math.abs(dx), n) + Math.pow(Math.abs(dy), n) <= 1;
    };
  }
  function ellipse(cx, cy, rx, ry) {
    return function (x, y) {
      var dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
      return dx * dx + dy * dy <= 1;
    };
  }
  function eggShape(cx, cy, rx, ry) {
    return function (x, y) {
      var dy = (y + 0.5 - cy) / ry;
      var r = dy < 0 ? rx * (1 - 0.28 * -dy) : rx;
      var dx = (x + 0.5 - cx) / r;
      return dx * dx + dy * dy <= 1;
    };
  }

  // Fill a shape with outline, base, a lower-right shade band, and an
  // optional highlight test.
  function fill(g, inside, pal, lightTest) {
    for (var y = 0; y < H; y++) {
      for (var x = 0; x < W; x++) {
        if (!inside(x, y)) continue;
        var edge = !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
        if (edge) { g.put(x, y, pal.outline); continue; }
        var c = pal.base;
        if (pal.shade && (!inside(x + 2, y + 1) || !inside(x + 1, y + 2))) c = pal.shade;
        if (lightTest && lightTest(x, y)) c = pal.light;
        g.put(x, y, c);
      }
    }
  }

  function topRow(inside, x) {
    for (var y = 0; y < H; y++) if (inside(x, y)) return y;
    return null;
  }

  // ---- body ----------------------------------------------------------
  var SIZE = { sprout: [9.6, 8.4], branch: [11, 9.4], merged: [12.2, 10.2] };

  function bodyFor(stage, phase) {
    var s = SIZE[stage] || SIZE.sprout;
    var rx = s[0], ry = s[1];
    if (phase) { rx += 0.45; ry -= 0.55; }
    return { cx: CX, cy: GROUND - 1 - ry, rx: rx, ry: ry };
  }

  function drawFeet(g, b, pal, step) {
    var fx = b.rx * 0.5;
    var lift = [0, 0];
    if (step === 1) lift = [-1, 0];
    if (step === 2) lift = [0, -1];
    [-1, 1].forEach(function (side, i) {
      var shape = ellipse(b.cx + side * fx, b.cy + b.ry - 0.4 + lift[i], 2.4, 1.7);
      fill(g, shape, { outline: NAVY, base: pal.shade });
    });
  }

  function drawBody(g, b, pal, ghost) {
    var inside = blob(b.cx, b.cy, b.rx, b.ry);
    if (ghost) {
      var wavy = function (x, y) {
        if (!inside(x, y)) {
          // let the bottom spill into a scalloped hem
          var below = y + 0.5 - (b.cy + b.ry * 0.55);
          if (below > 0 && inside(x, Math.floor(b.cy))) {
            var hem = b.ry * 0.62 + 1.2 * Math.sin((x + 0.5) * 1.3);
            return below < hem && Math.abs(x + 0.5 - b.cx) < b.rx - 0.6;
          }
          return false;
        }
        return true;
      };
      fill(g, wavy, { outline: 'rgba(6,47,84,0.55)', base: 'rgba(255,255,255,0.92)', shade: 'rgba(214,224,236,0.9)' });
      return wavy;
    }
    var hl = ellipse(b.cx - b.rx * 0.48, b.cy - b.ry * 0.5, Math.max(1.3, b.rx * 0.2), Math.max(1.0, b.ry * 0.15));
    fill(g, inside, { outline: NAVY, base: pal.base, shade: pal.shade, light: pal.light }, hl);
    // one bright glint
    g.put(Math.round(b.cx - b.rx * 0.6), Math.round(b.cy - b.ry * 0.62), '#FFFFFF');
    return inside;
  }

  // ---- face ------------------------------------------------------------
  // Eye sets: b (round 4x4, the default), a (2x3), c (2x2 dots).
  var EYESETS = {
    b: {
      w: 4, h: 4,
      open:    ['.NN.', 'NWNN', 'NNNN', '.NN.'],
      blink:   ['....', '....', 'NNNN', '....'],
      closed:  ['....', '....', 'N..N', '.NN.'],
      tired:   ['....', 'NNNN', 'NWNN', '.NN.'],
      arc:     ['.NN.', 'N..N', '....', '....'],
      side:    ['....', 'NNNN', '..WN', '..NN'],
      fluster: ['NN..', '..NN', 'NN..', '....'],
      hollow:  ['.NN.', 'NNNN', 'NNNN', '.NN.'],
      brows:   ['..NN', 'NN..']
    },
    a: {
      w: 2, h: 3,
      open:    ['WN', 'NN', 'NN'],
      blink:   ['..', '..', 'NN'],
      closed:  ['..', '..', 'NN'],
      tired:   ['..', 'NN', 'NN'],
      arc:     ['NN', '..', '..'],
      side:    ['NN', '.N', '.N'],
      fluster: ['N.', '.N', 'N.'],
      hollow:  ['NN', 'NN', 'NN'],
      brows:   ['.N', 'N.']
    },
    c: {
      w: 2, h: 2,
      open:    ['NN', 'NN'],
      blink:   ['..', 'NN'],
      closed:  ['..', 'NN'],
      tired:   ['..', 'NN'],
      arc:     ['NN', '..'],
      side:    ['NN', '.N'],
      fluster: ['N.', '.N'],
      hollow:  ['NN', 'NN'],
      brows:   ['.N', 'N.']
    }
  };
  var eyeStyle = 'b';

  var MOUTHS = {
    smile:  ['N..N', '.NN.'],
    grin:   ['NNNN', 'NppN', '.NN.'],
    flat:   ['.NN.'],
    wobble: ['.N.N.', 'N.N.N'],
    o:      ['.NN.', 'N..N', '.NN.'],
    small:  ['.N.', 'N.N'],
    dot:    ['NN', 'NN'],
    cat:    ['N.N.N', '.N.N.']
  };

  function faceGeom(b, style) {
    var E = EYESETS[style || eyeStyle];
    var d = E.w >= 4 ? Math.max(2, Math.round(b.rx * 0.24)) : Math.max(3, Math.round(b.rx * 0.36));
    var ey = Math.round(b.cy - E.h / 2 - 0.6);
    return { d: d, ex: CX - d - E.w, ey: ey, my: ey + E.h + 1, E: E };
  }

  // over: optional {eyes, mouth} that replaces the mood's face for a frame.
  function drawFace(g, b, mood, blink, style, over) {
    var f = faceGeom(b, style), E = f.E;
    var m = MOODS[mood] || MOODS.content;
    if (over) {
      var mm = {}, k;
      for (k in m) mm[k] = m[k];
      for (k in over) mm[k] = over[k];
      m = mm;
    }
    var eyes = m.eyes;
    if (blink && (eyes === 'open' || eyes === 'tired')) eyes = 'blink';

    if (m.blush) g.pair(['PP'], f.ex - 1, f.ey + E.h, false);
    if (m.flush) g.pair(['pPp'], f.ex - 1, f.ey + E.h);

    var sprite = E[eyes] || E.open;
    var mirror = !(eyes === 'side' || eyes === 'open' || eyes === 'tired' || eyes === 'blink');
    g.pair(sprite, f.ex, f.ey, mirror);

    if (m.brows === 'worried') g.pair(E.brows, f.ex, f.ey - 3);

    var mouth = MOUTHS[m.mouth] || MOUTHS.smile;
    g.sprite(mouth, CX - Math.floor(mouth[0].length / 2) - (mouth[0].length % 2 ? 0 : 0), f.my);
    return f;
  }

  // ---- the sprout ------------------------------------------------------
  var NODE = ['.NN.', 'NgGN', 'NGGN', '.NN.'];
  var NODE_B = ['.NN.', 'NbBN', 'NBBN', '.NN.'];
  var NODE_GREY = ['.NN.', 'NSSN', 'NSsN', '.NN.'];
  var HEART_BUD = ['.NN.NN.', 'NgGNbBN', 'NGGGBBN', 'NGGGBBN', '.NGGBN.', '..NGN..', '...N...'];
  var BINDLE = ['..N.N..', '.NRNRN.', 'NRRNRRN', 'NWRRRWN', 'NRRWRRN', 'NRWRRWN', '.NNNNN.'];

  function stem(g, pts, col) {
    for (var i = 0; i < pts.length; i++) g.put(pts[i][0], pts[i][1], col || NAVY);
  }

  function drawSprout(g, b, stage, kind, sway, ghost) {
    var inside = blob(b.cx, b.cy, b.rx, b.ry);
    var top = topRow(inside, 23);
    var x = 23, pts = [], i;
    var node = ghost ? NODE_GREY : NODE;
    var ink = ghost ? 'rgba(6,47,84,0.55)' : NAVY;

    if (kind === 'droop' || kind === 'bindle') {
      if (kind === 'bindle') {
        pts = [[x, top - 1], [x, top - 2], [x + 1, top - 3], [x + 2, top - 4], [x + 3, top - 5], [x + 4, top - 6], [x + 5, top - 7], [x + 6, top - 8], [x + 7, top - 9]];
        stem(g, pts, ink);
        g.sprite(BINDLE, x + 5, top - 8);
        return;
      }
      pts = [[x, top - 1], [x, top - 2], [x, top - 3], [x + 1, top - 4], [x + 2, top - 5], [x + 3, top - 5], [x + 4, top - 4], [x + 5, top - 3]];
      stem(g, pts, ink);
      g.sprite(node, x + 4, top - 3);
      return;
    }
    if (kind === 'sleepy') {
      pts = [[x, top - 1], [x, top - 2], [x - 1, top - 3], [x - 2, top - 4], [x - 3, top - 4], [x - 4, top - 4]];
      stem(g, pts, ink);
      g.sprite(node, x - 7, top - 6);
      return;
    }
    if (kind === 'knot') {
      stem(g, [[x, top - 1], [x, top - 2]], ink);
      g.sprite(['.NNN.', 'N.N.N', 'NN.NN', 'N.N.N', '.NNN.'], x - 2, top - 7);
      stem(g, [[x + 1, top - 8], [x + 2, top - 9]], ink);
      g.sprite(node, x + 1, top - 13);
      return;
    }

    var h = stage === 'sprout' ? 5 : stage === 'branch' ? 6 : 7;
    var tipX = x;
    for (i = 1; i <= h; i++) {
      var off = Math.round(sway * Math.pow(i / h, 1.6));
      pts.push([x + off, top - i]);
      tipX = x + off;
    }
    stem(g, pts, ink);

    if (stage === 'branch') {
      var bs = Math.round(sway * 0.5);
      stem(g, [[x + 1, top - 3], [x + 2, top - 4], [x + 3 + bs, top - 5]], ink);
      g.sprite(ghost ? NODE_GREY : NODE_B, x + 2 + bs, top - 8);
    }
    if (stage === 'merged') {
      var ms = Math.round(sway * 0.4);
      g.sprite(['..NNN', '.NgGN', 'NGGN.', 'NNN..'], x + 1, top - 5);
    }
    if (stage === 'merged' && !ghost) g.sprite(HEART_BUD, tipX - 3, top - h - 6);
    else g.sprite(node, tipX - 1, top - h - 3);
  }

  // ---- the egg -------------------------------------------------------
  function drawEgg(g, pal, t, shake) {
    var tilt = shake ? [1, -1][t % 2] : [0, 0, 0, 0, 1, 0, -1, 0][t % 8];
    var cx = CX + 0, cy = GROUND - 11, rx = 8.2, ry = 11;
    var inside = eggShape(cx, cy, rx, ry);
    var g2 = new Grid();
    var hl = ellipse(cx - 3.5, cy - 4.5, 1.4, 2.2);
    fill(g2, inside, { outline: NAVY, base: pal.shell, shade: pal.spot, light: '#FFFFFF' }, hl);
    // spots
    [[cx + 2.2, cy - 2.5, 1.6], [cx - 2.5, cy + 3.5, 1.9], [cx + 3.5, cy + 5, 1.2]].forEach(function (s) {
      var sp = ellipse(s[0], s[1], s[2], s[2] * 0.9);
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
        if (sp(x, y) && inside(x, y) && inside(x - 1, y) && inside(x + 1, y) && inside(x, y - 1) && inside(x, y + 1)) g2.put(x, y, pal.spot);
      }
    });
    // crack across the top third
    var cy0 = Math.round(cy - 6);
    [[19, 0], [20, -1], [21, 0], [22, 1], [23, 0], [24, -1], [25, 0], [26, 1], [27, 0], [28, -1]].forEach(function (p) {
      if (inside(p[0], cy0 + p[1])) g2.put(p[0], cy0 + p[1], NAVY);
    });
    // the bud poking out of the top
    var top = topRow(inside, 23);
    g2.put(23, top - 1, NAVY);
    g2.sprite(NODE, 22, top - 5);
    // copy with tilt (rows above the middle lean)
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = g2.px[y * W + x];
      if (!c) continue;
      var lean = y < cy ? tilt : 0;
      g.put(x + lean, y, c);
    }
  }

  // The bottom half of the shell, worn for a moment after hatching.
  // drop: how far it has fallen away (0 = just hatched).
  function drawShellCup(g, pal, drop) {
    var cx = CX, cy = GROUND - 2.6, rx = 10.4, ry = 5.2;
    var inside = ellipse(cx, cy, rx, ry);
    var rim = function (x) { return Math.round(cy - 1 + ((x % 4) < 2 ? -1 : 1)); };
    var cup = function (x, y) { return inside(x, y) && y >= rim(x); };
    var g2 = new Grid();
    fill(g2, cup, { outline: NAVY, base: pal.shell, shade: pal.spot });
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = g2.px[y * W + x];
      if (c) g.put(x - g.ox + (x < CX ? -1 : 1) * Math.round(drop / 2), y - g.oy + drop, c);
    }
  }

  // ---- items ---------------------------------------------------------
  var ITEMS = {
    headphones: { name: 'Tiny headphones', slot: 'ears' },
    beanie:     { name: 'Beanie', slot: 'head' },
    glasses:    { name: 'Reading glasses', slot: 'face' },
    shades:     { name: 'Sunglasses', slot: 'face' },
    halo:       { name: 'Halo', slot: 'head' },
    bowtie:     { name: 'Bow tie', slot: 'neck' },
    guitar:     { name: 'Guitar', slot: 'hand' },
    cap:        { name: 'Graduation cap', slot: 'head' },
    crown:      { name: 'Nitpick crown', slot: 'head' }
  };

  function drawHalo(g, b, inside) {
    var top = topRow(inside, 23);
    var cy = top - 4.5, cx = 23.5;
    var outer = ellipse(cx, cy, 7.2, 2.4), inner = ellipse(cx, cy, 5.0, 0.9);
    for (var y = Math.floor(cy - 4); y <= cy + 4; y++) for (var x = 10; x < 38; x++) {
      if (!outer(x, y) || inner(x, y)) continue;
      var edge = !outer(x - 1, y) || !outer(x + 1, y) || !outer(x, y - 1) || !outer(x, y + 1) || inner(x, y - 1) || inner(x, y + 1) || inner(x - 1, y) || inner(x + 1, y);
      g.put(x, y, edge ? '#A87C00' : (y < cy ? INK.u : INK.Y));
    }
  }

  function drawHeadphones(g, b, inside) {
    var f = faceGeom(b);
    var lx = Math.round(b.cx - b.rx) - 2;
    var cupTop = f.ey - 1;
    // band follows the head, one pixel above it
    for (var x = lx + 1; x <= 2 * CX - lx - 2; x++) {
      var t = topRow(inside, x);
      var y = t === null ? cupTop : Math.min(t - 1, cupTop);
      g.put(x, y, NAVY);
      if (t !== null && t - 1 < cupTop) {
        // nothing else needed
      }
    }
    // short drops from the band ends down to the cups
    var lt = topRow(inside, lx + 2), y0 = (lt === null ? cupTop : lt - 1);
    for (var y = y0; y <= cupTop; y++) { g.put(lx + 1, y, NAVY); g.put(2 * CX - lx - 2, y, NAVY); }
    g.pair(['.NN.', 'NBBN', 'NbBN', 'NBBN', '.NN.'], lx - 1, cupTop);
  }

  function drawBeanie(g, b) {
    var big = blob(b.cx, b.cy - 0.3, b.rx + 0.7, b.ry + 0.9);
    var line = Math.round(b.cy - b.ry * 0.42);
    var region = function (x, y) { return big(x, y) && y <= line; };
    for (var y = 0; y <= line; y++) for (var x = 0; x < W; x++) {
      if (!region(x, y)) continue;
      var edge = !region(x - 1, y) || !region(x + 1, y) || !region(x, y - 1);
      var c;
      if (edge) c = NAVY;
      else if (y >= line - 1) c = y === line ? NAVY : INK.r;
      else c = x % 2 ? INK.R : INK.d;
      g.put(x, y, c);
    }
  }

  function drawHardhat(g, b) {
    var big = blob(b.cx, b.cy - 0.4, b.rx + 0.8, b.ry + 1.0);
    var line = Math.round(b.cy - b.ry * 0.45);
    var region = function (x, y) { return big(x, y) && y < line; };

    for (var bx = CX - half; bx < CX + half; bx++) { g.put(bx, line, NAVY); g.put(bx, line - 1, (bx === CX - half || bx === CX + half - 1) ? NAVY : INK.Y); }
  }

  function drawCap(g, b, inside) {
    var top = topRow(inside, 23);
    var y = top - 2;
    g.sprite(['....NNNNNNNNNNNNNN....', '.NNKKKKKKKKKKKKKKKKNN.', 'NKKKKkkKKKKKKKKKKKKKKN', '.NNKKKKKKKKKKKKKKKKNN.', '....NNNNNNNNNNNNNN....'], CX - 11, y - 3);

  }

  function drawCrown(g, b, inside) {
    var top = topRow(inside, 23);
    g.sprite([
      'N....N....N',
      'NN..NYN..NN',
      'NYNNYYYNNYN',
      'NYYYYYYYYYN',
      'NYRYYRYYRYN',
      'NyYYYYYYYyN',
      'NNNNNNNNNNN'
    ], CX - 6, top - 5);
  }

  function drawGlasses(g, b, sun) {
    var f = faceGeom(b), E = f.E;
    var inside = blob(b.cx, b.cy, b.rx, b.ry);
    if (sun) {
      // wide, solid, dark lenses under one thick bar, with a shine
      var lw = E.w + 4, lx = f.ex - 2, ly = f.ey - 1;
      var lens = [];
      for (var r = 0; r < 4; r++) {
        var row = '';
        for (var c = 0; c < lw; c++) {
          if (r === 3 && (c === 0 || c === lw - 1)) row += '.';
          else if (r === 0) row += 'N';
          else if (c === 0 || c === lw - 1 || r === 3) row += 'N';
          else if ((r === 1 && c === 1) || (r === 1 && c === 2) || (r === 2 && c === 1)) row += 'W';

      g.pair(lens, lx, ly, false);
      for (var x = lx + lw; x < 2 * CX - lx - lw; x++) { g.put(x, ly, NAVY); g.put(x, ly + 1, NAVY); }

    }
    // reading glasses: round, see-through, eyes visible, a glint on each lens
    var rw = E.w + 3, rh = E.h + 3, rx0 = f.ex - 1.5, ry0 = f.ey - 1.5;
    var ring = function (x, y, cx) {
      var dx = (x + 0.5 - cx) / (rw / 2), dy = (y + 0.5 - (ry0 + rh / 2)) / (rh / 2);
      return dx * dx + dy * dy;
    };
    [rx0 + rw / 2, 2 * CX - (rx0 + rw / 2)].forEach(function (cx) {
      for (var y = Math.floor(ry0) - 1; y <= ry0 + rh + 1; y++) for (var x = Math.floor(cx - rw); x <= cx + rw; x++) {
        var d = ring(x, y, cx);
        if (d > 1.0) continue;
        if (d > 0.5) g.put(x, y, '#B07800');
        else if (g.px[(y + g.oy) * W + (x + g.ox)] !== NAVY && g.px[(y + g.oy) * W + (x + g.ox)] !== '#FFFFFF') g.put(x, y, 'rgba(196, 238, 255, 0.85)');
      }
      g.put(Math.round(cx - rw / 2 + 1.5), Math.round(ry0 + 1.5), '#FFFFFF');
    });
    var by = Math.round(ry0 + rh / 2) - 1;
    for (var x2 = Math.ceil(rx0 + rw) - 1; x2 <= 2 * CX - Math.ceil(rx0 + rw); x2++) g.put(x2, by, '#B07800');
  }

  function drawBowtie(g, b) {
    var f = faceGeom(b);
    g.sprite(['NN...NN', 'NRNNNrN', 'NRRdRRN', 'NRNNNRN', 'NN...NN'], CX - 4, f.my + 2);
  }

  // An acoustic guitar held at Patch's front right, neck up and out at 45
  // degrees (the guitar-emoji angle), so the whole instrument shows and
  // never crosses the face. Hand-placed pixels: a 9px lower bout and a 7px
  // upper bout make the figure-8, then the sound hole, the bridge bar, a
  // two-tone neck, and a dark headstock with four pegs.
  var GUITAR = [
    '...................NN.',
    '.................SNKKN',
    '.................NKKNS',
    '...............SNKKN..',
    '...............NLBNS..',
    '..............NLBN....',
    '.............NLBN.....',
    '............NLBN......',
    '........NNNNLBN.......',
    '.......NOOOLBN........',
    '......NOOOODN.........',
    '......NONNODN.........',
    '...NNNOONNODN.........',
    '.NNoOOOOOODN..........',
    '.NoOOOOODNN...........',
    'NoOOOOODN.............',
    'NOKKOOODN.............',
    'NOOKKOODN.............',
    '.NOOKODN..............',
    '.NNODDNN..............',
    '...NNN................'
  ];
  var GUITAR_INK = { D: '#D45400', L: '#C98A4B', B: '#8A4F1C' };

    // the sprout-stage face sits low, so its guitar drops one row. Uses the
    // resting body so the guitar stays put while Patch breathes.
    var f = faceGeom(bodyFor(stage, 0));

  }

  // Music notes drifting up beside Patch while it holds the guitar.
  function drawNotes(g, b, t) {

    var span = 14, r = t % span;

    var n2 = ['.NNNNN', '.N...N', '.N...N', 'NN..NN', 'NN..NN'];

    var y2 = Math.round(b.cy) - 8 - Math.floor(((r + 7) % span) / 1.5);

  // The patch Patch is named for: a little stitched square with a plus.
  var STITCH = ['NNNNN', 'NWGWN', 'NGGGN', 'NWGWN', 'NNNNN'];
  function drawStitch(g, b) {
    var inside = blob(b.cx, b.cy, b.rx, b.ry);
    var f = faceGeom(b);
    var interior = function (x, y) { return inside(x, y) && inside(x - 1, y) && inside(x + 1, y) && inside(x, y - 1) && inside(x, y + 1); };

  }

  // ---- effects -------------------------------------------------------
  function drawFx(g, b, fx, t, inside) {
    var top = topRow(inside, 23);
    if (fx === 'zzz') {
      var r = Math.floor(t / 3) % 3;
      g.sprite(['NNN', '..N', '.N.', 'N..', 'NNN'], CX + 8, top - 2 - r);

      var bob = Math.floor(t / 3) % 2;
      g.sprite(['..NNNNN..', '.NRRRRRN.', 'NRWRRRWRN', 'NRRWRWRRN', 'NRRRWRRRN', 'NRRWRWRRN', 'NRWRRRWRN', '.NRRRRRN.', '..NNNNN..'], CX + 10, top - 7 - bob);

  }

  function drawSweat(g, b, t) {
    var f = faceGeom(b);
    var drip = Math.floor(t / 4) % 2;
    g.sprite(['.N.', 'NcN', 'NCN', '.N.'], 2 * CX - f.ex + 3, f.ey - 3 + drip);

  // ---- moods ---------------------------------------------------------
  var MOODS = {
    content: { eyes: 'open', mouth: 'smile', blush: true },
    happy:   { eyes: 'arc', mouth: 'grin', blush: true, bounce: true },
    side:    { eyes: 'side', mouth: 'flat', brows: 'flat' },
    packing: { eyes: 'open', mouth: 'wobble', brows: 'worried', sprout: 'bindle', sweat: true },
    sleepy:  { eyes: 'closed', mouth: 'dot', sprout: 'sleepy', fx: 'zzz', slow: true },
    sick:    { eyes: 'tired', mouth: 'wobble', flush: true, fx: 'redx', sweat: true },
    knotted: { eyes: 'fluster', mouth: 'wobble', sprout: 'knot', sweat: true },
    nervous: { eyes: 'open', mouth: 'flat', brows: 'worried', sweat: true },
    proud:   { eyes: 'arc', mouth: 'grin', blush: true, fx: 'sparkle', bounce: true },

  // ---- draw ------------------------------------------------------------
  function render(opts, t) {
    t = t || 0;
    var pal = COLORS[opts.color] || COLORS.lime;
    var mood = MOODS[opts.mood] ? opts.mood : 'content';
    var m = MOODS[mood];
    var items = opts.items || [];
    eyeStyle = EYESETS[opts.eyes] ? opts.eyes : 'b';
    var g = new Grid();

    g.oy = opts.dy || 0;

    var sway = swayCycle[Math.floor(t / 2) % 6];

      if (items.indexOf('beanie') >= 0) drawBeanie(g, b);
      if (items.indexOf('hardhat') >= 0) drawHardhat(g, b);
      if (items.indexOf('glasses') >= 0) drawGlasses(g, b, false);
      if (items.indexOf('shades') >= 0) drawGlasses(g, b, true);
      if (items.indexOf('cap') >= 0) drawCap(g, b, blob(b.cx, b.cy, b.rx, b.ry));
      if (items.indexOf('crown') >= 0) drawCrown(g, b, blob(b.cx, b.cy, b.rx, b.ry));
      if (items.indexOf('bowtie') >= 0) drawBowtie(g, b);
      if (items.indexOf('guitar') >= 0) drawGuitar(g, opts.stage);
    }
    g.ox -= lean;
    if (!m.ghost) {
      if (items.indexOf('guitar') >= 0 && !opts.noNotes) drawNotes(g, b, t);
      if (m.sweat) drawSweat(g, b, t);
    }
    if (m.fx) drawFx(g, b, m.fx, t, blob(b.cx, b.cy, b.rx, b.ry));
    if (opts.shell !== undefined && opts.shell !== null) drawShellCup(g, pal, opts.shell);

    return g;
  }

  // Turn a finished frame into a white silhouette with a navy outline and a
  // soft yellow glow around it. Used while Patch is growing.
  function silhouette(g) {
    var src = g.px.slice();
    var at = function (x, y) { return x >= 0 && y >= 0 && x < W && y < H && !!src[y * W + x]; };
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var i = y * W + x;

  }

  // ---- growing up --------------------------------------------------------
  // The animation that plays when Patch moves up a stage (sprout to branch
  // when the review lands, branch to merged at the merge). Hatching is its
  // own animation. Patch.grow(o, from, to, f) fills in the opts for frame f

  var GROW_FRAMES = 44;

    else if (f < 14) {                                                     // scrunches up and quivers

      o.face = { eyes: 'fluster', mouth: 'wobble' }; o.dx = f % 2 ? 1 : -1;

    // step out so the outline stays clean, and come back for the reveal
    else if (f < 30) { o.stage = FLICKER[f - 14] ? to : from; o.mood = 'content'; o.silhouette = true; o.items = []; }

  }

  function paint(canvas, g) {
    var ctx = canvas.getContext('2d');
    var s = canvas.width / W;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = false;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = g.px[y * W + x];

      ctx.fillRect(x * s, y * s, s, s);

  function draw(canvas, opts, t) { paint(canvas, render(opts, t)); }

  // Paint a Patch grid into any context at a pixel offset and scale.
  function paintAt(ctx, g, ox, oy, s) {

      ctx.fillRect((i + ox) * s, (j + oy) * s, s, s);
    }
  }

  // A pixel heart for the hearts row: full, or empty.
  var HEART = ['.NN.NN.', 'NRRNrRN', 'NRRRRRN', 'NRRRRRN', '.NRRRN.', '..NRN..', '...N...'];
  var HEART_EMPTY = ['.NN.NN.', 'NSSNSSN', 'NSSSSSN', 'NSSSSSN', '.NSSSN.', '..NSN..', '...N...'];
  function drawHeart(canvas, full) {
    var ctx = canvas.getContext('2d');
    var rows = full ? HEART : HEART_EMPTY;
    var s = canvas.width / 7;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var j = 0; j < rows.length; j++) for (var i = 0; i < 7; i++) {
      var ch = rows[j].charAt(i);
      if (ch === '.') continue;
      ctx.fillStyle = INK[ch];
      ctx.fillRect(i * s, j * s, s, s);
    }
  }

  global.Patch = {
    W: W, H: H, COLORS: COLORS, MOODS: MOODS, ITEMS: ITEMS, INK: INK,
    render: render, paint: paint, draw: draw, drawHeart: drawHeart, Grid: Grid,
    grow: grow, GROW_FRAMES: GROW_FRAMES,
    paintAt: paintAt, sprite: sprite, EYESETS: EYESETS, GROUND: GROUND,
    headTop: function (stage) { var b = bodyFor(stage === 'egg' ? 'sprout' : stage, 0); return topRow(blob(b.cx, b.cy, b.rx, b.ry), 23); }
  };
})(window);

<script>
/* Walk-out scenes: where Patch goes when the room runs out of hearts.

(function (global) {

        '......NNNNNNNNNNNN......',

        '.NNbbbBBBBBBBBBBBBbbbNN.',
        'NbbBBBBBBBBBBBBBBBBBBbbN',
        'NbBBBBBBBBBBBBBBBBBBBBbN',
        'NBBBBBBBBBBBBBBBBBBBBBBN',

   wins Patch back with a snack, and picks up at the first call it got
   wrong on that try, with 3 hearts and the options reshuffled. Everything

      { frames: 22, opts: function (o, f) { o.mood = 'packing'; o.dx = f * 2; o.dy = HOPS[f % 5]; o.step = 1 + (f % 2); return o; } },
      { frames: 1000000, opts: function (o) { o.dx = 60; return o; } }
    ]);
  }
  function animWinBack() {
    play([
      { frames: 18, opts: function (o, f) { o.mood = 'side'; o.dx = -36 + f * 2; o.dy = HOPS[f % 5]; o.step = 1 + (f % 2); return o; } },
      { frames: 16, opts: function (o) { o.mood = 'side'; return o; } }
    ]);
    setTimeout(function () { ui.bubble = '...fine.'; drawBubble(); }, 3000);
    setTimeout(function () { ui.bubble = null; drawBubble(); }, 5600);
  }
  function animGrow(from, to) {
    var flip = function (o, f) { o.stage = (Math.floor(f / 2) % 2) ? to : from; o.mood = 'happy'; return o; };
    play([{ frames: 16, opts: flip }, { frames: 10, opts: function (o) { o.stage = to; o.mood = 'proud'; return o; } }]);
  }

  // ------------------------------------------------------------ the ticker
  function lookFor(spec) {
    var p = spec.split(':');
    if (p[0] === 'egg') return { color: p[1], stage: 'egg', mood: 'content', items: [], shake: ui.t % 24 < 4 };
    if (p[0] === 'item') { var it = s.wearing.filter(function (x) { return K.SLOT[x] !== K.SLOT[p[1]]; }).concat([p[1]]); return { color: s.color, stage: s.hatched ? s.stage : 'sprout', mood: 'happy', items: it }; }
    if (p[0] === 'hero') return { color: 'capri', stage: 'branch', mood: 'happy', items: ['headphones'] };
    if (p[0] === 'sib') {
      var gh = ui.ghostShow;
      return { color: s.sibling.color, stage: 'sprout', mood: gh ? 'ghost' : (s.posts['w4-close'] ? 'proud' : 'content'), items: [] };
    }
    if (p[0] === 'pet') {
      var pet = C.overtime.pets.filter(function (x) { return x.id === p[1]; })[0];
      var st = s.ot && s.ot.pets[pet.id] ? s.ot.pets[pet.id].state : 'open';
      return { color: pet.color, stage: pet.stage, mood: st === 'happy' ? 'happy' : st === 'grumpy' ? 'side' : 'content', items: [] };
    }
    if (p[0] === 'big') { var o = baseLook(); o.mood = p[1] || o.mood; return o; }
    if (p[0] === 'newegg') return { color: C.eggs[(C.eggs.indexOf(s.color) + 2) % 4], stage: 'egg', mood: 'content', items: [], shake: ui.t % 30 < 4 };
    return baseLook();
  }
  function tick() {
    ui.t++;
    var a = ui.anim;
    if (a) {
      a.f++;
      if (a.f >= a.steps[a.i].frames) {
        a.i++; a.f = 0;
        if (a.i >= a.steps.length) { ui.anim = null; if (a.done) a.done(); }
      }
    }
    var md = $('mood');
    if (md && s) { var ml = moodLine(); if (md.textContent !== ml) md.textContent = ml; }
    var cvs = document.querySelectorAll('canvas[data-draw]');
    for (var i = 0; i < cvs.length; i++) {
      var cv = cvs[i], d = cv.getAttribute('data-draw');
      try {
        if (d === 'main') P.draw(cv, lookNow(), ui.t);
        else if (d === 'monty') drawMonty(cv, ui.t);
        else if (d.indexOf('scene:') === 0) PS.draw(cv, d.slice(6), { color: s.color, stage: s.hatched ? s.stage : 'sprout', items: s.wearing }, ui.t);
        else if (d === 'booth') drawBooth(cv);
        else P.draw(cv, lookFor(d), ui.t);
      } catch (e) { /* a sprite change mid-edit should never stop the game */ }
    }
  }

  // ------------------------------------------------------------ pieces
  var AV = ['#D7FFEE', '#E9F6FF', '#FFF6BF', '#FFEEFF', '#FFEDF0', '#93FCAC', '#FEA08D', '#9FD8FF'];
  function avatar(who) {
    if (who === 'ren') return '<span class="av" style="background:#00C385;color:#062F54">R</span>';
    if (who === 'you') return '<span class="av" style="background:#4F5DFF;color:#FFFFFF">Y</span>';
    var h = 0; for (var i = 0; i < who.length; i++) h = (h * 31 + who.charCodeAt(i)) >>> 0;
    return '<span class="av" style="background:' + AV[h % AV.length] + '">' + esc(who[0].toUpperCase()) + '</span>';
  }
  function who(w) { return w === 'ren' ? 'Ren' : w === 'you' ? 'You' : '@' + w; }
  function eventHtml(e, day, isNew) {
    var nw = isNew ? '<span class="tag newtag">New</span>' : '';
    if (e.note) return '<div class="sys' + (isNew ? ' new' : '') + '">' + fmt(e.note) + (day ? ' <span class="soft">Day ' + day + '</span>' : '') + '</div>';
    if (e.status) return '<div class="sys status">' + fmt(e.status) + '</div>';
    if (e.checks) {
      return '<ul class="checks">' + e.checks.map(function (c) {
        var lab = c[1] === 'pass' ? 'Passed' : c[1] === 'fail' ? 'Failed' : 'Pending';
        return '<li><span class="ck ' + c[1] + '">' + lab + '</span><b>' + esc(c[0]) + '</b><span class="soft">' + fmt(c[2]) + '</span></li>';
      }).join('') + '</ul>';
    }
    var head = '<div class="who">' + esc(who(e.who)) + (e.bot ? '<span class="tag">bot</span>' : '') +
      (e.review ? '<span class="rv ' + (e.review === 'approved' ? 'approved' : e.review === 'commented' ? 'reviewed' : 'changes') + '">' + esc(e.review === 'approved' ? 'Approved' : e.review === 'commented' ? 'Reviewed' : 'Changes requested') + '</span>' : '') +
      (day ? '<span class="day">Day ' + day + '</span>' : '') + nw + '</div>';
    var body = '<div>' + fmt(e.text) + '</div>';
    if (e.comments) {
      body += e.comments.map(function (c, i) {
        return '<div class="rc"><span class="n">' + (i + 1) + '</span>' + (c.where ? '<span class="where">' + esc(c.where) + '</span>' : '') +
          '<div>' + fmt(c.text) + '</div>' +
          (c.suggestion ? '<div class="sugg">' + c.suggestion.map(function (l) { return '<div class="' + (l[0] === '+' ? 'plus' : 'minus') + '">' + esc(l) + '</div>'; }).join('') + '</div>' : '') + '</div>';
      }).join('');
    }
    return '<div class="ev' + (isNew ? ' new' : '') + '">' + avatar(e.who) + '<div class="body">' + head + body + '</div></div>';
  }
  function mineHtml(lines, day) {
    return '<div class="ev mine">' + avatar('you') + '<div class="body"><div class="who">You<span class="day">Day ' + day + '</span></div>' +
      lines.map(function (l) { return '<div>' + fmt(l) + '</div>'; }).join('') + '</div></div>';
  }
  function heartsHtml() {
    var out = '';
    for (var i = 0; i < K.HEARTS; i++) out += '<canvas width="28" height="28" data-heart="' + (i < s.hearts ? 1 : 0) + '"' + (i === ui.lostAt ? ' class="pop"' : '') + ' aria-hidden="true"></canvas>';
    return '<div class="hearts" role="img" aria-label="' + s.hearts + ' of 3 hearts">' + out + '</div>';
  }
  function paintHearts() {
    var hs = document.querySelectorAll('canvas[data-heart]');
    for (var i = 0; i < hs.length; i++) P.drawHeart(hs[i], hs[i].getAttribute('data-heart') === '1');
  }
  function moodLine() {
    var n = esc(s.name || 'Patch');
    if (!s.hatched || ui.eggHold) {
      if (s.phase === 'walkout') return 'The egg is cracking. It does not look happy.';
      if (s.phase === 'turn' && s.hearts === 2) return 'The egg wobbled at you. It seemed disappointed.';
      if (s.phase === 'turn' && s.hearts === 1) return 'The egg is rolling toward the door.';
      return 'Still an egg. Something is moving in there.';
    }
    var m = moodNow();
    return {
      content: n + ' is waiting with you.', happy: n + ' likes that.', side: n + ' is giving you a look.',
      packing: n + ' is packing a tiny bag.', knotted: n + ' is tied in a knot. So is your branch.',
      nervous: n + ' is nervous about this one.', sleepy: n + ' dozed off.', proud: n + ' is very proud of you.'
    }[m] || n + ' is here.';
  }
  function stageLine() {
    var pr = 'PR #' + C.pr.num;
    if (!s.hatched || ui.eggHold) return 'Egg · ' + pr + ' just opened';
    return { sprout: 'Sprout · ' + pr + ' open', branch: 'Branch · ' + pr + ' reviewed', merged: 'Merged · ' + pr + ' landed' }[s.stage];
  }

  function sideHtml() {
    var wardrobe = s.owned.length ? '<div class="wardrobe">' + s.owned.map(function (id) {
      return '<button class="chip" data-act="wear" data-id="' + id + '" aria-pressed="' + (s.wearing.indexOf(id) >= 0) + '">' + esc(P.ITEMS[id] ? P.ITEMS[id].name : id) + '</button>';
    }).join('') + '</div>' : '';
    var sib = s.week === 4 && s.sibling && (s.phase === 'turn' || s.phase === 'walkout' || s.phase === 'weekdone')
      ? '<canvas class="sib" width="96" height="96" data-draw="sib" aria-label="' + esc(s.sibling.name) + ', the pet for PR #236"></canvas>' : '';
    var showHearts = s.phase === 'turn' || s.phase === 'walkout';
    var pet = '<section class="pet" aria-label="' + esc(s.name || 'Patch') + '">' +

      '<div class="pname">' + esc(s.name || '???') + '</div><div class="pstage">' + stageLine() + '</div>' + (sib ? '<div class="pstage">' + esc(s.sibling.name) + ' · PR #236</div>' : '') +
      (showHearts ? heartsHtml() : '') + '<div class="mood" id="mood">' + moodLine() + '</div>' + wardrobe + '</section>';
    var monty = montyPanelHtml();
    // Open by default; if the room closes it, it stays closed as screens change.
    var repo = '<details class="repo"' + (ui.repoClosed ? '' : ' open') + '><summary>' + esc(C.repo || 'playlistr') + '\'s CONTRIBUTING.md</summary><ol>' +
      C.contributing.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ol></details>';
    return pet + monty + repo;
  }
  function drawBubble() {
    var home = document.querySelector('.pet .home');

    if (ui.bubble && !b) { b = document.createElement('div'); b.className = 'bubble'; home.appendChild(b); }
    if (b) { if (ui.bubble) b.textContent = ui.bubble; else b.remove(); }
  }

  function calHtml() {
    var d = dayNow();
    return C.calendar.map(function (w) {
      var cells = '';
      for (var x = w.from; x <= w.to; x++) cells += '<span class="cal-d' + (x < d ? ' past' : '') + (x === d ? ' now' : '') + '" title="Day ' + x + '"></span>';
      var here = d >= w.from && d <= w.to;
      return '<div class="cal-wk' + (here ? ' cur' : '') + '"><div class="cal-l">' + esc(w.label) + '</div><div class="cal-days">' + cells + '</div></div>';
    }).join('') + (d ? '<div class="cal-day" aria-live="polite">Day ' + d + '</div>' : '');
  }

  function paceHtml() {
    var w = s.week, start = s.weekStart[w];
    if (!start) return '';
    var aim = weekCfg().aim * 60000, used = Date.now() - start;
    var over = used > aim;
    return '<span class="pace' + (over ? ' over' : '') + '" id="pace">' + paceText(aim, used) + '</span>';
  }
  function paceText(aim, used) {
    // Counts down the week's suggested time. At zero it stops and says so; nothing locks.
    var left = Math.max(0, Math.ceil((aim - used) / 1000));
    return left > 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + ' left' : '0:00 · going over is fine';
  }

  function threadHtml(r) {
    var w = weekCfg(), list = K.weekTurns(s.week);
