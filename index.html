    var pr2 = !!(here && here.pr2);
    var old = [], fresh = [];
    list.forEach(function (t, i) {
      if (i > s.idx || !!t.pr2 !== pr2) return;
      var day = K.val(t.day), isNow = i === s.idx, into = isNow ? fresh : old;
      (t.events || []).forEach(function (e) { into.push(eventHtml(e, e.checks || e.status ? 0 : day, isNow && !s.ts.done)); });
      var done = i < s.idx || (isNow && s.ts.done);
      if (done && s.posts[t.id]) into.push(mineHtml(s.posts[t.id], day));
      if (done && t.after) t.after.forEach(function (e) { into.push(eventHtml(e, day, false)); });
    });
    var mergeIdx = list.findIndex(function (t) { return t.id === 'w3-merge'; });
    var merged = !pr2 && (s.week > 3 || (s.week === 3 && (mergeIdx < s.idx || (mergeIdx === s.idx && s.ts.done))));
    var closed = pr2 && s.posts['w4-close'];
    var pr = pr2 ? C.pr2 : C.pr;
    var state = merged ? '<span class="pill merged">Merged</span>' : closed ? '<span class="pill closed">Closed</span>' : '<span class="pill open">Open</span>';
    var ren = w.renStatus ? ' · Ren: <b>' + esc(w.renStatus) + '</b>' : '';
    var openOld = r && r.type === 'editor';
    var earlier = old.length ? '<details class="earlier"' + (openOld ? ' open' : '') + '><summary>Earlier on the thread this week (' + old.length + ')</summary><div class="events">' + old.join('') + '</div></details>' : '';
    if (!fresh.length) fresh.push('<div class="sys">Nothing new on the thread.</div>');
    return '<section class="thread" aria-label="The PR thread"><div class="pr-head"><span class="repo-n">' + esc(C.repo || 'playlistr') + '</span><span class="pr-t">#' + pr.num + ' ' + fmt(pr.title) + '</span>' + state + '</div>' +
      '<div class="pr-sub">Fixes #' + pr.issue.num + ': ' + esc(pr.issue.title) + (pr2 ? ' (closed by #239 on day 21)' : '') + ren + '</div>' +
      earlier + '<div class="events">' + fresh.join('') + '</div></section>';
  }

  // Ren's review comment a turn is about, quoted beside the question.
  function quoteHtml(r) {
    if (r.raw.refComment === undefined) return '';
    var rv = K.weekTurns(s.week).filter(function (t) { return t.id === 'w2-review'; })[0];
    var c = rv && rv.events[0].comments[r.raw.refComment];
    if (!c) return '';
    return '<div class="rc" style="margin:0 0 14px"><span class="n">' + (r.raw.refComment + 1) + '</span>' + (c.where ? '<span class="where">' + esc(c.where) + '</span>' : '') + '<div>' + fmt(c.text) + '</div>' +
      (c.suggestion ? '<div class="sugg">' + c.suggestion.map(function (l) { return '<div class="' + (l[0] === '+' ? 'plus' : 'minus') + '">' + esc(l) + '</div>'; }).join('') + '</div>' : '') + '</div>';
  }

  // After a reload, an answered turn still shows why its answer was right.
  function restoredSay() {
    var r = cur();
    if (!r || s.phase !== 'turn' || !s.ts.done) return null;
    if (r.type === 'editor') return { right: true, text: r.raw.say };
    var o = (r.options || []).filter(function (x) { return x.right; })[0];
    return o ? { right: true, text: o.say } : null;
  }
  function sayHtml() {
    var x = ui.said || restoredSay();
    if (!x) return '';
    if (x.right) {
      var r = cur(), row = r && r.raw.rule ? C.playbook.filter(function (p) { return p.id === r.raw.rule; })[0] : null;
      return '<div class="say right" role="status"><div class="h">Right.</div><div>' + fmt(nm(x.text)) + '</div>' +
        (row ? '<div class="written"><span>\u2731</span>Written into Monty\'s playbook: <b>' + esc(row.title) + '</b></div>' : '') + '</div>';
    }
    var h = '<div class="h"><canvas width="21" height="21" data-heart="0" aria-hidden="true"></canvas>Minus one heart</div>';
    if (x.problems) {
      return '<div class="say wrong" role="alert">' + h + '<div>Not ready to send yet:</div><ul>' + x.problems.map(function (p) {
        var what = p.kind === 'cut' ? 'Still in: ' : p.kind === 'keep' ? 'You cut: ' : p.kind === 'need' ? 'Missing: ' : 'You added: ';
        return '<li><b>' + what + '</b><q>' + fmt(p.text) + '</q> ' + fmt(p.say) + '</li>';
      }).join('') + '</ul></div>';
    }
    return '<div class="say wrong" role="alert">' + h + '<div>' + fmt(nm(x.text)) + '</div>' + (x.ghost ? '<div class="big-art"><canvas width="144" height="144" data-draw="sib" style="width:144px;height:144px" aria-hidden="true"></canvas></div><div class="soft">Try again: there\'s a better ending.</div>' : '') + '</div>';
  }
  function continueHtml() {
    if (!s.ts.done) return '';
    return '<div class="after"><button class="cta" data-act="cont" type="button" autofocus>Continue</button></div>';
  }
  function hintHtml() {
    if (!K.hintsOn(s) || s.ts.done) return '';
    return '<button class="ghost" data-act="hint" type="button">Ask ' + esc(HELPER) + ' for a hint</button>';
  }

  function optionButtons(r, cls) {
    var opts = K.ordered(s, r);
    return opts.map(function (o, i) {
      var x = s.ts.crossed.indexOf(o.id) >= 0, done = s.ts.done;
      var c = cls + (o.mono ? ' mono' : '') + (x ? ' x' : '') + (done && o.right ? ' ok' : '') + (done && !o.right && !x ? ' dim' : '') + (s.ts.hinted.indexOf(o.id) >= 0 ? ' hinted' : '');
      var code = o.code ? '<pre class="code">' + esc(o.code.join('\n')) + '</pre>' : '';
      var label = o.mono ? esc(o.label) : fmt(o.label);
      return '<button type="button" class="' + c + '" data-act="pick" data-id="' + o.id + '"' + (x || done ? ' disabled' : '') + ' aria-label="' + esc(o.label.replace(/`/g, '')) + (x ? ' (crossed out)' : '') + '">' +
        (cls === 'opt' ? '<span class="k">' + String.fromCharCode(65 + i) + '</span><span class="tx">' + label + code + '</span>' : label + code) + '</button>';
    }).join('');
  }

  function termHtml(r) {
    var g = r.raw.term, list = K.weekTurns(s.week), lines = [], plan = '';
    var first = list.findIndex(function (t) { return t.term === g; });
    for (var i = first; i <= s.idx; i++) {
      var t = list[i];
      if (!t || t.term !== g) continue;
      if (t.termPlan) {
        var pt = list.filter(function (x) { return x.id === t.termPlan; })[0];
        if (pt) plan = '<div class="draft tplan"><div class="dk"><span>Monty\'s plan · you run it</span></div>' + pt.draft.lines.map(function (l) { return '<p>' + fmtCmd(l) + '</p>'; }).join('') + '</div>';
      }
      if (t.termStart) lines = lines.concat(t.termStart);
      if (i < s.idx || s.ts.done) {
        var right = K.resolve(t).options.filter(function (o) { return o.right; })[0];
        lines.push(right.mono ? '$ ' + right.label : '# ' + right.label.replace(/`/g, ''));
        lines = lines.concat(right.out || []);
      }
    }
    // Nothing run yet (a turn about a GitHub button): no empty terminal.
    if (!lines.length && !s.ts.done) return plan;
    return plan + '<div class="term" aria-label="Terminal"><div class="th">Your terminal · ~/playlistr <span class="nw">(' + esc(C.pr.branch) + ')</span></div>' +
      lines.map(function (l) {
        var c = /^\$ /.test(l) ? 'cmd' : /FAILED|CONFLICT|error|Error|Rejected/.test(l) ? 'err' : '';
        return '<div class="' + c + '">' + esc(l) + '</div>';
      }).join('') + (s.ts.done ? '' : '<div class="cmd">$ _</div>') + '</div>';
  }

  function montyHtml(r) {
    var rd = r.read, kind = { message: 'A reply to post', plan: 'A plan to run', note: 'A note to you' }[r.draft.kind];
    var grid = [['state', 'State', rd.state], ['', 'Checks', rd.checks], ['', 'Review', rd.review], ['', 'Quiet', rd.quiet + (rd.quiet === 1 ? ' day' : ' days')], ['', 'Merge', rd.merge]];
    return '<div class="mfield"><div class="monty-head"><span class="mbadge"><canvas width="64" height="64" data-draw="monty" aria-hidden="true"></canvas></span><div><b>Monty read the thread</b><span>' + esc(rd.why) + '</span></div></div>' +
      '<div class="read">' + grid.map(function (g) { return '<div class="' + g[0] + '"><b>' + g[1] + '</b><span>' + esc(g[2]) + '</span></div>'; }).join('') + '</div>' +
      (rd.rule || rd.found ? '<div class="mwhy">' + (rd.rule ? esc(rd.rule) : '') + (rd.found ? '<span class="found">Monty looked it up: ' + fmt(rd.found) + '</span>' : '') + '</div>' : '') +
      '<div class="draft"><div class="dk"><span>Monty\'s draft · ' + kind + '</span><span>Confidence: 100%</span></div>' +
      r.draft.lines.map(function (l) { return '<p>' + fmt(l) + '</p>'; }).join('') + '</div></div>' +
      '<p class="eyebrow callhead">Your call</p><div class="acts">' + optionButtons(r, 'act') + '</div>';
  }

  function editorHtml(r) {
    var ts = s.ts, probIds = (ts.problems || []).map(function (p) { return p.id; });
    var row = function (l, tray) {
      var on = tray ? !!ts.add[l.id] : !ts.cut[l.id];
      var cls = 'ln' + (tray ? ' tray' + (on ? ' on' : '') : (on ? '' : ' cut')) + (probIds.indexOf(l.id) >= 0 ? ' prob' : '') + (ts.hinted.indexOf(l.id) >= 0 ? ' hint' : '');
      var tag = tray ? (on ? 'Added' : 'Add') : (on ? 'In' : 'Cut');
      return '<button type="button" class="' + cls + '" data-act="' + (tray ? 'add' : 'cut') + '" data-id="' + l.id + '"' + (ts.done ? ' disabled' : '') + ' aria-pressed="' + (tray ? on : !on) + '"><span class="tg">' + tag + '</span><span class="tx">' + fmt(l.text) + '</span></button>';
    };
    var out = K.composed(r, ts);
    return '<div class="ask">' + fmt(nm(r.raw.ask)) + '</div>' +
      '<div class="ed-h">Monty\'s draft · click a line to cut it or keep it</div><div class="ed-lines">' + r.lines.map(function (l) { return row(l, false); }).join('') + '</div>' +
      (r.tray.length ? '<div class="ed-h" style="margin-top:14px">Lines you can add · click to add or remove</div><div class="ed-lines">' + r.tray.map(function (l) { return row(l, true); }).join('') + '</div>' : '') +
      '<div class="preview"><div class="pv-h">What gets posted</div>' + (out.length ? out.map(function (l) { return '<p>' + fmt(l) + '</p>'; }).join('') : '<p class="soft">Nothing yet.</p>') + '</div>' +
      (ts.done ? '' : '<div class="after">' + hintHtml() + '<button class="cta" data-act="send-edit" type="button"' + (out.length ? '' : ' disabled') + '>' + esc(r.raw.send || 'Send') + '</button></div>');
  }

  function sceneHtml(r) {
    return '<div class="card mint center"><div class="big-art"><canvas width="240" height="240" data-draw="big:proud" aria-hidden="true"></canvas></div>' +
      '<h2>' + esc(r.raw.title) + '</h2>' + r.raw.text.map(function (x) { return '<p class="lead" style="margin:8px auto">' + fmt(nm(x)) + '</p>'; }).join('') +
      '<div class="after" style="justify-content:center"><button class="cta" data-act="scene" type="button" autofocus>Continue</button></div></div>';
  }

  function interHtml() {
    var x = ui.inter, name = esc(s.name);
    if (x.kind === 'hatch') {
      return '<div class="card butter center"><p class="eyebrow">Day ' + x.day + '</p><h2>Something\'s happening</h2>' +
        '<p class="lead" style="margin:10px auto">' + esc(C.hatchLine || 'While you waited, the egg started to wobble.') + '</p>' +
        '<div class="after" style="justify-content:center"><button class="cta" data-act="hatch" type="button" autofocus' + (ui.anim ? ' disabled' : '') + '>' + (x.hatched ? 'Say hi to ' + name : 'Watch') + '</button></div></div>';
    }
    if (x.kind === 'skip') {
      return '<div class="card center"><p class="eyebrow">Time passes</p><h2>' + (x.from === x.to ? 'Day ' + x.from + ' passes' : 'Days ' + x.from + ' to ' + x.to + ' pass') + '</h2>' +
        '<p class="lead" style="margin:10px auto">' + esc(nm(x.text)) + '</p>' +
        '<div class="after" style="justify-content:center"><button class="cta" data-act="inter" type="button" autofocus>Day ' + (x.to + 1) + '</button></div></div>';
    }
    if (x.kind === 'replay') {
      return '<div class="card butter center"><p class="eyebrow">Week ' + s.week + ', try ' + s.attempt[s.week] + '</p><h2>' + name + ' is back</h2>' +
        '<p class="lead" style="margin:10px auto">You pick up on day ' + cur().day + ', at the first call you got wrong. You have 3 hearts again, and the buttons are in a new order, so read each one.</p>' +
        (K.hintsOn(s) ? '<p>' + esc(HELPER) + ' is checking in. <b>Ask ' + esc(HELPER) + ' for a hint</b> appears on each turn and crosses out one wrong answer.</p>' : '') +
        '<div class="after" style="justify-content:center"><button class="cta" data-act="inter" type="button" autofocus>Back to day ' + cur().day + '</button></div></div>';
    }
    return '';
  }

  function renderTurn() {
    var r = cur();
    if (!r) return;
    var body;
    if (!ui.inter && r.type === 'scene' && !s.ts.done) {
      var was = s.stage;
      K.sceneDone(s); save();
      if (r.raw.art === 'merge' && was !== 'merged') { animGrow(was, 'merged'); setTimeout(confetti, 300); }
    }
    if (ui.inter) body = interHtml();
    else if (r.type === 'scene') body = threadHtml(r) + sceneHtml(r);
    else {
      var d;
      if (r.type === 'monty') d = montyHtml(r);
      else if (r.type === 'choice' && r.raw.rule) d = ruleHtml(r);
      else if (r.type === 'choice') {
        d = (r.raw.ref ? '<div class="ref">' + esc(r.raw.ref) + '</div>' : '') + quoteHtml(r) + '<div class="ask">' + fmt(nm(r.raw.ask)) + '</div>' +
          (r.raw.term ? termHtml(r) : '') +
          (r.raw.code ? '<pre class="code">' + esc(r.raw.code.join('\n')) + '</pre>' : '') +
          '<div class="opts">' + optionButtons(r, 'opt') + '</div>';
      } else d = editorHtml(r);
      var hint = r.type !== 'editor' && K.hintsOn(s) && !s.ts.done ? '<div class="after" style="justify-content:flex-start">' + hintHtml() + '</div>' : '';
      var quiet = r.type === 'choice' && !(r.raw.events || []).length;
      var decide = '<section class="decide" aria-label="Your move">' + d + hint + sayHtml() + continueHtml() + '</section>';
      // Turns with nothing new on the thread put the decision first.
      body = quiet ? decide + threadHtml(r) : threadHtml(r) + decide;
    }
    show(weekHead() + body);
  }

  function renderWalkout() {
    var line = K.walkOutLine(s), name = esc(s.name);
    var art = line.scene && PS.ids.indexOf(line.scene) >= 0
      ? '<canvas class="scene-cv" width="576" height="336" data-draw="scene:' + line.scene + '" aria-hidden="true"></canvas>'
      : '<div class="big-art"><canvas width="240" height="240" data-draw="big:sleepy" aria-hidden="true"></canvas></div>';
    var back = K.resolve(K.weekTurns(s.week)[K.restartIdx(s)]).day;
    var list = s.mistakes.map(function (m) { return '<li><b>' + fmt(m.label) + '</b>' + fmt(nm(m.say)) + '</li>'; }).join('');
    show(weekHead() + '<div class="card peach center"><p class="eyebrow" style="color:#9E4A6E">Out of hearts</p><h2>' + name + ' walked out</h2>' + (s.leftAsEgg ? '<p class="soft">' + name + ' hatched early, just so it could leave.</p>' : '') + art +
      '<p class="lead" style="margin:6px auto 14px">' + esc(nm(line.text)) + '</p></div>' +
      '<div class="card"><h3>What sent ' + name + ' away</h3><ul class="mistakes">' + list + '</ul>' +
      '<h3 style="margin-top:10px">Win ' + name + ' back</h3><p class="soft">Offer a snack. Then you pick up on day ' + back + ', at the first call you got wrong.</p>' +
      '<div class="snacks">' + C.snacks.map(function (x) { return '<button class="cta" type="button" data-act="snack" data-id="' + esc(x) + '">Offer ' + esc(x) + '</button>'; }).join('') + '</div></div>');
  }

  function renderWeekDone() {
    var w = weekCfg(), offer = K.itemOffer(s), name = esc(s.name);
    var perfect = s.perfect[w.n] ? '<span class="badge">Perfect week: no hearts lost</span>' : '';
    var grow = w.n === 2 ? '<p>' + name + ' grew a branch. The review forked the sprout.</p>' : '';
    var outro = '<p class="lead">' + fmt(nm(w.outro)) + '</p>' + (w.n === 4 ? '<div class="big-art"><canvas width="144" height="144" style="width:144px;height:144px" data-draw="newegg" aria-hidden="true"></canvas></div>' : '');
    var items = offer.items.concat(offer.rare ? [offer.rare] : []);
    show('<div class="card mint"><p class="eyebrow">Week ' + w.n + ' passed</p><h1 style="margin:6px 0 10px">' + esc(w.name) + ': done</h1>' + perfect + outro + grow +
      (items.length ? '<h3 style="margin-top:14px">Pick one to keep</h3><div class="items">' + items.map(function (id) {
        var rare = id === offer.rare;
        return '<button type="button" class="item' + (rare ? ' rare' : '') + '" data-act="item" data-id="' + id + '"><canvas width="144" height="144" data-draw="item:' + id + '" aria-hidden="true"></canvas>' + esc(P.ITEMS[id].name) + (rare ? '<span class="r">Rare: perfect week</span>' : '') + '</button>';
      }).join('') + '</div>' : '<div class="after"><button class="cta" data-act="item" data-id="" type="button">' + (w.n < 4 ? 'On to week ' + (w.n + 1) : 'Finish') + '</button></div>') + '</div>');
  }

  function renderFinale() {
    var name = esc(s.name), walks = 0, lost = 0, tries = [];
    [1, 2, 3, 4].forEach(function (w) { walks += s.walkouts[w] || 0; lost += s.lost[w] || 0; tries.push(s.attempt[w] || 1); });
    var mins = Math.round(((s.finishedAt || Date.now()) - (s.weekStart[1] || s.startedAt)) / 60000);
    var badges = K.badges(s);
    var ot = s.ot ? K.petsHappy(s) : 0;
    show('<div class="card closing"><div><p class="eyebrow">Day 28 · Four weeks passed</p><h1 style="margin:6px 0 12px">' + name + ' made it</h1>' +
      C.finale.map(function (x) { return '<p class="lead" style="margin:6px 0">' + fmt(x) + '</p>'; }).join('') + '</div>' +
      '<canvas width="240" height="240" style="width:240px;height:240px" data-draw="big:proud" aria-hidden="true"></canvas></div>' +
      '<div class="card"><div class="stats"><div><b>4 of 4</b>weeks passed</div><div><b>' + walks + '</b>walk-out' + (walks === 1 ? '' : 's') + '</div><div><b>' + lost + '</b>heart' + (lost === 1 ? '' : 's') + ' lost</div><div><b>' + s.owned.length + '</b>item' + (s.owned.length === 1 ? '' : 's') + '</div><div><b>' + mins + ' min</b>weeks 1 to 4</div></div>' +
      (badges.length ? badges.map(function (b) { return '<span class="badge" title="' + esc(b.why) + '">' + esc(b.name) + '</span>'; }).join('') : '') +
      playbookFinalHtml() +
      '<h3 style="margin-top:18px">Still have time?</h3>' +
      '<div class="next3"><button type="button" data-act="to-ot" class="' + (ot === 4 ? 'done' : '') + '"><b>Pet-sitting</b><span>' + (s.ot ? ot + ' of 4 pets happy. ' : '') + 'Four contributors ask what to do next. Each case flips a lesson from the game.</span></button>' +
      '<button type="button" data-act="to-boss" class="' + (s.boss && s.boss.sent ? 'done' : '') + '"><b>The Nitpick Storm</b><span>17 review comments at once. Just for fun, no hearts.</span></button>' +
      '<button type="button" data-act="to-booth"><b>Photo booth</b><span>Dress ' + name + ' up and download a portrait.</span></button></div></div>', { full: true });
  }

  function renderOvertime() {
    var O = C.overtime, name = esc(s.name);
    if (ui.pet) {
      var p = O.pets.filter(function (x) { return x.id === ui.pet; })[0], st = s.ot.pets[p.id];
      var said = ui.petSaid;
      var opts = p.options.map(function (o, i) {
        var x = st.crossed.indexOf(i) >= 0, done = st.state !== 'open';
        return '<button type="button" class="opt' + (x ? ' x' : '') + (done && o.right && st.state === 'happy' ? ' ok' : '') + '" data-act="pet-pick" data-id="' + i + '"' + (done ? ' disabled' : '') + '><span class="k">' + String.fromCharCode(65 + i) + '</span><span class="tx">' + fmt(o.label) + '</span></button>';
      }).join('');
      var res = said ? (said.right
        ? '<div class="say right" role="status"><div class="h">' + esc(p.name) + ' went home happy</div><div>' + fmt(said.say) + '</div></div>'
        : '<div class="say wrong" role="alert"><div class="h">' + esc(p.name) + ' went home grumpy</div><div>' + fmt(said.say) + '</div><div class="after" style="justify-content:flex-start"><button class="ghost" data-act="pet-open" data-id="' + p.id + '" type="button">Try ' + esc(p.name) + ' again</button></div></div>') : '';
      show('<div class="row" style="justify-content:space-between"><div><p class="eyebrow">Pet-sitting · ' + esc(p.repo) + '</p><h2>' + esc(p.name) + ', @' + esc(p.owner) + '\'s PR</h2></div><button class="ghost" data-act="pet-back" type="button">All pets</button></div>' +
        '<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><canvas width="120" height="120" style="width:120px;height:120px;flex:none" data-draw="pet:' + p.id + '" aria-hidden="true"></canvas>' +
        '<section class="thread" style="flex:1"><div class="events">' + p.events.map(function (e) { return eventHtml(e, 0, false); }).join('') + '</div></section></div>' +
        '<section class="decide"><div class="draft" style="margin-top:0"><div class="dk"><span>@' + esc(p.owner) + '\'s PR-monitor drafted</span><span>Confidence: 100%</span></div><p>' + fmt(p.draft) + '</p></div>' +
        '<div class="ask" style="margin-top:14px">' + fmt(p.ask) + '</div><div class="opts">' + opts + '</div>' + res +
        (said && said.right ? '<div class="after"><button class="cta" data-act="pet-back" type="button" autofocus>Back to the pets</button></div>' : '') + '</section>');
      return;
    }
    var happy = K.petsHappy(s);
    show('<p class="eyebrow">Bonus round</p><h2 style="margin-bottom:8px">Pet-sitting</h2>' + O.intro.map(function (x) { return '<p class="lead">' + fmt(nm(x)) + '</p>'; }).join('') +
      '<div class="cards4">' + O.pets.map(function (p) {
        var st = s.ot.pets[p.id].state;
        return '<button type="button" class="petcard ' + st + '" data-act="pet-open" data-id="' + p.id + '"><canvas width="96" height="96" data-draw="pet:' + p.id + '" aria-hidden="true"></canvas><b>' + esc(p.name) + '</b><span class="soft">@' + esc(p.owner) + ' · ' + esc(p.repo) + '</span><div style="font-weight:700;margin-top:4px">' + (st === 'happy' ? 'Went home happy' : st === 'grumpy' ? 'Went home grumpy: try again' : 'Needs help') + '</div>' + (st === 'happy' ? '<div class="soft">' + esc(p.flips) + '</div>' : '') + '</button>';
      }).join('') + '</div>' +
      '<div class="card" style="margin-top:4px"><b>' + happy + ' of 4</b> pets went home happy.' + (happy === 4 ? ' ' + name + ' misses them already.' : '') +
      '<div class="after"><button class="ghost" data-act="to-finale" type="button">Back to the finish</button>' + (happy === 4 ? '<button class="cta" data-act="to-boss" type="button">Take on the Nitpick Storm</button>' : '') + '</div></div>');
  }

  function renderBoss() {
    var B = C.boss, left = K.bossLeft(s), b = s.boss;
    var rows = B.comments.map(function (c, i) {
      var got = b.sorted[i];
      var sorts = got ? '<span class="got">' + esc(B.sorts.filter(function (x) { return x.id === got; })[0].label) + '</span>'
        : '<div class="sorts">' + B.sorts.map(function (x) { return '<button type="button" data-act="boss-sort" data-i="' + i + '" data-id="' + x.id + '">' + esc(x.label) + '</button>'; }).join('') + '</div>';
      var quip = b.quip && b.quip.idx === i ? '<div class="quip" role="alert">' + esc(b.quip.text) + '</div>' : '';
      return '<div class="sc' + (got ? ' done' : '') + '"><span class="n">' + (i + 1) + '</span><div><div class="who">' + esc(who(c.who)) + '</div><div class="t">' + fmt(c.text) + '</div></div>' + sorts + quip + '</div>';
    }).join('');
    var end = b.sent
      ? '<div class="card mint"><h3>Your reply</h3>' + B.reply.map(function (x) { return '<p>' + fmt(x) + '</p>'; }).join('') +
        '<div class="ev" style="margin-top:12px">' + avatar('mira') + '<div class="body"><div class="who">@mira<span class="rv approved">Approved</span></div><div>' + esc(B.win) + '</div></div></div>' +
        '<p style="margin-top:12px"><b>' + esc(s.name) + ' earned the Nitpick crown.</b></p><div class="after"><button class="cta" data-act="to-finale" type="button">Back to the finish</button><button class="ghost" data-act="to-booth" type="button">Photo booth</button></div></div>'
      : '<div class="after"><button class="ghost" data-act="to-finale" type="button">Back to the finish</button><button class="cta" data-act="boss-send" type="button"' + (left ? ' disabled' : '') + '>Send one reply</button></div>';
    show('<p class="eyebrow">Boss round · just for fun</p><h2 style="margin-bottom:8px">The Nitpick Storm</h2>' +
      '<div class="pr-head" style="margin-bottom:8px"><span class="repo-n">playlistr</span><span class="pr-t">#' + B.pr.num + ' ' + fmt(B.pr.title) + '</span><span class="pill open">Open</span></div>' +
      B.intro.map(function (x) { return '<p class="lead">' + fmt(x) + '</p>'; }).join('') +
      '<div class="storm-left"><span>' + (left ? left + ' comment' + (left === 1 ? '' : 's') + ' left to sort' : 'All 17 sorted') + '</span><span>No hearts here</span></div>' +
      '<div class="storm">' + rows + '</div>' + end, { full: true });
  }

  // ------------------------------------------------------------ photo booth
  var BG = {
    studio: function (ctx, k) { r(ctx, k, 0, 0, 96, 96, '#FFF6BF'); r(ctx, k, 0, 78, 96, 18, '#E9EEF4'); r(ctx, k, 8, 10, 26, 20, '#E9F6FF'); r(ctx, k, 20, 10, 2, 20, '#FFFFFF'); r(ctx, k, 8, 19, 26, 2, '#FFFFFF');
      ring(ctx, k, 74, 22, 9, '#062F54'); ring(ctx, k, 74, 22, 3, '#FE3C84'); r(ctx, k, 0, 77, 96, 1, '#D3DAE2'); },
    stage: function (ctx, k) { r(ctx, k, 0, 0, 96, 96, '#1B1C57'); ctx.fillStyle = 'rgba(255,246,191,0.22)';
      ctx.beginPath(); ctx.moveTo(48 * k, 0); ctx.lineTo(22 * k, 82 * k); ctx.lineTo(74 * k, 82 * k); ctx.closePath(); ctx.fill();
      r(ctx, k, 0, 82, 96, 14, '#C99600'); for (var x = 0; x < 96; x += 12) r(ctx, k, x, 82, 1, 14, '#A67C00');
      [10, 30, 66, 86].forEach(function (x) { r(ctx, k, x, 4, 2, 2, '#FFFFFF'); }); },
    park: function (ctx, k) { r(ctx, k, 0, 0, 96, 96, '#E9F6FF'); ring(ctx, k, 80, 14, 7, '#FFCB03'); r(ctx, k, 10, 14, 18, 5, '#FFFFFF'); r(ctx, k, 14, 11, 10, 3, '#FFFFFF');
      r(ctx, k, 0, 80, 96, 16, '#93FCAC'); r(ctx, k, 0, 80, 96, 2, '#4CDA8E'); [6, 18, 70, 88].forEach(function (x) { r(ctx, k, x, 86, 1, 3, '#00C385'); r(ctx, k, x + 1, 85, 1, 2, '#00C385'); }); },
    plain: function (ctx, k) { r(ctx, k, 0, 0, 96, 96, '#D7FFEE'); r(ctx, k, 0, 82, 96, 14, '#B5F5D9'); }
  };
  function r(ctx, k, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x * k, y * k, w * k, h * k); }
  function ring(ctx, k, cx, cy, rad, c) { ctx.fillStyle = c; for (var y = -rad; y <= rad; y++) for (var x = -rad; x <= rad; x++) if (x * x + y * y <= rad * rad) ctx.fillRect((cx + x) * k, (cy + y) * k, k, k); }
  function drawBooth(cv) {
    var ctx = cv.getContext('2d'), k = cv.width / 96;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    (BG[s.booth.backdrop] || BG.studio)(ctx, k);
    var o = baseLook(); o.mood = 'proud';
    P.paintAt(ctx, P.render(o, ui.t), 24, 82 - P.GROUND, k);
    var label = (s.name || 'Patch') + ' · playlistr #233';
    ctx.font = '700 ' + Math.round(3.6 * k) + 'px "Space Mono", monospace';
    var w = ctx.measureText(label).width + 6 * k;
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    roundRect(ctx, (96 * k - w) / 2, 86.5 * k, w, 7 * k, 2 * k); ctx.fill();
    ctx.fillStyle = '#062F54'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, 48 * k, 90.2 * k);
  }
  function roundRect(ctx, x, y, w, h, rad) { ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad); ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath(); }
  function renderBooth() {
    show('<p class="eyebrow">Photo booth</p><h2 style="margin-bottom:12px">Say cheese, ' + esc(s.name) + '</h2>' +
      '<div class="booth"><canvas width="480" height="480" data-draw="booth" aria-label="A portrait of ' + esc(s.name) + '"></canvas><div>' +
      '<h3>Backdrop</h3><div class="wardrobe" style="justify-content:flex-start;margin:8px 0 16px">' + C.backdrops.map(function (b) {
        return '<button class="chip grey" data-act="booth-bg" data-id="' + b.id + '" aria-pressed="' + (s.booth.backdrop === b.id) + '">' + esc(b.name) + '</button>';
      }).join('') + '</div>' +
      '<h3>Wardrobe</h3><div class="wardrobe" style="justify-content:flex-start;margin:8px 0 16px">' + (s.owned.length ? s.owned.map(function (id) {
        return '<button class="chip grey" data-act="wear" data-id="' + id + '" aria-pressed="' + (s.wearing.indexOf(id) >= 0) + '">' + esc(P.ITEMS[id].name) + '</button>';
      }).join('') : '<span class="soft">No items yet.</span>') + '</div>' +
      '<div class="row"><button class="cta" data-act="download" type="button">Download the portrait</button><button class="ghost" data-act="to-finale" type="button">Back to the finish</button></div>' +
      '<p class="soft" style="margin-top:12px">Share it in your breakout room\'s Zoom chat when you\'re done.</p></div></div>', { full: true });
  }

  // ------------------------------------------------------------ confetti
  function confetti() {
    var box = $('confetti');
    if (!box || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
    var cols = ['#00C385', '#4F5DFF', '#02BCFF', '#93FCAC', '#B243FF', '#FFCB03'];
    for (var i = 0; i < 70; i++) {
      var e = document.createElement('i');
      e.style.left = Math.random() * 100 + 'vw';
      e.style.background = cols[i % cols.length];
      e.style.animationDelay = Math.random() * 0.8 + 's';
      box.appendChild(e);
    }
    setTimeout(function () { box.innerHTML = ''; }, 4000);
  }

  // ------------------------------------------------------------ actions
  function afterPick(res, r) {
    if (!res) return;
    if (res.right) {
      ui.said = { right: true, text: res.say };
      ui.happyUntil = Date.now() + 1800;
      report('right', { turn: r.id });
    } else {
      ui.lostAt = s.hearts;
      ui.said = { right: false, text: res.say, problems: res.problems || null, ghost: !!res.ghost, mood: res.option && res.option.mood };
      if (res.ghost) { ui.ghostShow = true; setTimeout(function () { ui.ghostShow = false; }, 6000); }
      report(res.walkout ? 'walkout' : 'wrong', { turn: r.id });
      if (res.walkout) {
        save();
        // Let the room read why for a moment, then Patch packs up.
        ui.walkPending = true;
        var egg = s.leftAsEgg, mine = s;
        ui.eggHold = egg;   // stay an egg while the room reads why
        render(true);
        var leave = function () { ui.eggHold = false; ui.walkPending = false; ui.said = null; ui.lostAt = -1; animWalkOut(); render(); };
        setTimeout(function () {
          if (s !== mine) return;
          if (!egg) return leave();
          animStormHatch(leave);   // the animation draws the egg, then the sprout
        }, 3200);
        return;
      }
    }
    save(); render(true);
    var c = document.querySelector('[data-act="cont"]');
    if (c) c.focus({ preventScroll: false });
  }

  function goNext() {
    var before = cur(), prevDay = before ? before.day : 0;
    K.next(s, Date.now());
    ui.said = null; ui.lostAt = -1;
    if (s.phase === 'weekdone') {
      report('pass');
      confetti();
      if (s.week === 2) animGrow('sprout', 'branch');
    } else {
      var r = cur();
      if (r && r.raw.hatch && !s.hatched) ui.inter = { kind: 'hatch', day: r.day };
      else if (r && r.day - prevDay >= 2) ui.inter = { kind: 'skip', from: prevDay + 1, to: r.day - 1, text: C.idle[(prevDay + s.week) % C.idle.length] };
      report('next');
    }
    save(); render();
  }

  function act(a, el) {
    var id = el.getAttribute('data-id');
    switch (a) {
      case 'resume': s = store.get(STORE_KEY); ui.inter = null; ui.said = null; report('resume'); render(); break;
      case 'reset':
        if (armed(ui.resetArmed)) { store.del(STORE_KEY); s = null; ui.resetArmed = 0; } else ui.resetArmed = Date.now();
        render(); break;
      case 'egg': K.setEgg(s, id); s.nameIdx = 0; report('egg'); save(); render(); break;
      case 'reroll': K.rerollName(s); save(); render(true); break;
      case 'keepname':
        K.setName(s, C.names[s.nameIdx]);
        if (DEMO) ui.inter = { kind: 'hatch', day: 1 };
        report('name'); save(); render(); break;
      case 'demo-restart':
        if (!DEMO) break;
        store.del(STORE_KEY); s = demoState();
        ui.inter = null; ui.said = null; ui.anim = null; ui.lostAt = -1; ui.walkPending = false; ui.eggHold = false; ui.bubble = null;
        save(); render(); break;
      case 'demo-leave': location.href = location.href.split('#')[0].split('?')[0]; break;
      case 'begin': {
        K.beginWeek(s, Date.now());
        var first = cur(), from = C.calendar[s.week - 1].from;
        if (first && first.day > from) ui.inter = { kind: 'skip', from: from, to: first.day - 1, text: C.idle[s.week % C.idle.length] };
        report('week'); save(); render(); break;
      }
      case 'pick': { var r = cur(); afterPick(K.choose(s, id), r); break; }
      case 'cut': K.toggleCut(s, id); ui.said = null; report('edit'); save(); render(true); break;
      case 'add': K.toggleAdd(s, id); ui.said = null; report('edit'); save(); render(true); break;
      case 'send-edit': { var r2 = cur(); afterPick(K.submitEdit(s), r2); break; }
      case 'hint': K.useHint(s); report('hint'); save(); render(true); break;
      case 'cont': goNext(); break;
      case 'scene': goNext(); break;
      case 'hatch':
        if (ui.inter.hatched) { ui.inter = null; render(); break; }
        el.disabled = true;
        animHatch(function () { K.hatch(s); ui.inter.hatched = true; report('hatch'); save(); render(true); });
        break;
      case 'inter': ui.inter = null; render(); break;
      case 'snack':
        K.winBack(s, id);
        ui.inter = { kind: 'replay' };
        animWinBack(); report('winback'); save(); render(); break;
      case 'item': K.pickItem(s, id, Date.now()); if (s.phase === 'finale') { report('finish'); confetti(); } else report('item'); save(); render(); break;
      case 'wear': K.toggleWear(s, id); save(); render(true); break;
      case 'to-ot': K.startOvertime(s); ui.pet = null; ui.petSaid = null; report('pets'); save(); render(); break;
      case 'pet-open': K.openPet(s, id); ui.pet = id; ui.petSaid = null; save(); render(); break;
      case 'pet-pick': { var res = K.petChoose(s, Number(id)); ui.petSaid = res; if (res && res.right) { ui.happyUntil = Date.now() + 1800; } report('pet', { sat: ui.pet }); save(); render(true); break; }
      case 'pet-back': ui.pet = null; ui.petSaid = null; render(); break;
      case 'to-boss': K.startBoss(s); report('boss'); save(); render(); break;
      case 'boss-sort': K.bossSort(s, Number(el.getAttribute('data-i')), id); report('sort'); save(); render(true); break;
      case 'boss-send': if (K.bossSend(s)) { confetti(); report('boss'); } save(); render(true); break;
      case 'to-booth': s.phase = 'booth'; save(); render(); break;
      case 'booth-bg': s.booth.backdrop = id; save(); render(true); break;
      case 'download': {
        var cv = document.querySelector('canvas[data-draw="booth"]');
        if (!cv) break;
        drawBooth(cv);
        var a2 = document.createElement('a');
        a2.download = (s.name || 'patch').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-portrait.png';
        a2.href = cv.toDataURL('image/png');
        document.body.appendChild(a2); a2.click(); a2.remove();
        report('booth');
        break;
      }
      case 'to-finale': s.phase = 'finale'; ui.pet = null; save(); render(); break;
      default: break;
    }
  }

  // details elements fire toggle without bubbling, so listen in the capture phase.
  document.addEventListener('toggle', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('repo')) ui.repoClosed = !e.target.open;
  }, true);
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    act(el.getAttribute('data-act'), el);
  });

  // Keep the pace pill and the calendar's day current.
  setInterval(function () {
    var p = $('pace');
    if (!p || !s || !s.weekStart[s.week]) return;
    var aim = weekCfg().aim * 60000, used = Date.now() - s.weekStart[s.week];
    p.textContent = paceText(aim, used);
    p.classList.toggle('over', used > aim);
  }, 1000);
  setInterval(tick, 166);
  // A once-a-minute check-in for the staff board, so it can tell a closed
  // game from a room that's talking. The board never counts it as a move.
  setInterval(function () { if (s && !s.finishedAt) report('ping'); }, 60000);

  // Boot: a saved game shows the start screen with Keep going. The demo skips
  // the room number and picks up its own save, if it has one.
  if (DEMO) { var ds = store.get(STORE_KEY); s = ds && ds.v === 2 && ds.demo ? ds : demoState(); ui.inter = s.phase === 'intro' && !s.hatched ? { kind: 'hatch', day: 1 } : null; save(); }
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { tick(); });
})();

</script>
